<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 900" width="640" height="900">
  <defs>
    <!-- sticker outline so the black ring reads on dark backgrounds -->
    <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD43B"/><stop offset="1" stop-color="#F2B705"/>
    </linearGradient>
    <g id="glove">
      <!-- open hand, fingers up, centred on palm (0,0) -->
      <g fill="#FFFFFF" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round">
        <rect x="-33" y="-74" width="20" height="52" rx="10" transform="rotate(-14 -23 -30)"/>
        <rect x="-14" y="-84" width="20" height="60" rx="10" transform="rotate(-4 -4 -30)"/>
        <rect x="5" y="-80" width="20" height="56" rx="10" transform="rotate(6 15 -30)"/>
        <rect x="22" y="-66" width="18" height="46" rx="9" transform="rotate(18 31 -30)"/>
        <rect x="-62" y="-22" width="44" height="20" rx="10" transform="rotate(-28 -40 -12)"/>
        <path d="M-36 -34 Q-40 10 -22 28 Q0 42 24 28 Q42 10 38 -34 Z"/>
      </g>
      <path d="M-20 -30 v14 M0 -30 v16 M18 -30 v14" stroke="#D9D4CC" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    <g id="cuff">
      <rect x="-30" y="-14" width="60" height="28" rx="12" fill="#F4EDE0" stroke="#1E1B18" stroke-width="5"/>
      <path d="M-18 -9 v18 M-6 -10 v20 M6 -10 v20 M18 -9 v18" stroke="#D8CDB8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="shoe">
      <!-- sneaker pointing right, ankle at (0,0) -->
      <g stroke="#1E1B18" stroke-width="5" stroke-linejoin="round">
        <path d="M-34 -6 Q-36 30 -30 40 L70 40 Q86 40 86 26 Q84 8 60 2 L22 -10 Q0 -14 -34 -6 Z" fill="#FFFFFF"/>
        <path d="M58 2 Q84 8 86 26 Q86 40 70 40 L56 40 Q50 20 58 2 Z" fill="#1E1B18"/>
        <path d="M-32 40 L72 40 Q84 40 86 30" fill="none"/>
        <rect x="-34" y="38" width="120" height="12" rx="6" fill="#FFFFFF"/>
      </g>
      <path d="M8 -6 l12 10 M20 -8 l12 10 M32 -4 l10 8" stroke="#1E1B18" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g id="sock">
      <rect x="-28" y="-16" width="56" height="30" rx="10" fill="#F5C518" stroke="#1E1B18" stroke-width="5"/>
      <path d="M-14 -11 v20 M0 -12 v22 M14 -11 v20" stroke="#D9A800" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- confetti (behind) -->
  <g>
    <rect x="70" y="330" width="16" height="26" rx="3" fill="#F5C518" transform="rotate(25 78 343)"/>
    <rect x="560" y="300" width="14" height="24" rx="3" fill="#FFFFFF" transform="rotate(-30 567 312)"/>
    <rect x="40" y="520" width="14" height="22" rx="3" fill="#E63946" transform="rotate(40 47 531)"/>
    <rect x="590" y="480" width="16" height="24" rx="3" fill="#F5C518" transform="rotate(-15 598 492)"/>
    <rect x="300" y="40" width="14" height="24" rx="3" fill="#3A86FF" transform="rotate(20 307 52)"/>
    <rect x="190" y="70" width="12" height="20" rx="3" fill="#FFFFFF" transform="rotate(-35 196 80)"/>
    <rect x="430" y="60" width="14" height="22" rx="3" fill="#F5C518" transform="rotate(50 437 71)"/>
    <rect x="80" y="700" width="14" height="22" rx="3" fill="#3A86FF" transform="rotate(-25 87 711)"/>
    <rect x="560" y="690" width="14" height="22" rx="3" fill="#E63946" transform="rotate(30 567 701)"/>
    <circle cx="30" cy="250" r="8" fill="#F5C518"/>
    <circle cx="610" cy="200" r="7" fill="#3A86FF"/>
    <circle cx="380" cy="30" r="7" fill="#E63946"/>
    <circle cx="610" cy="600" r="7" fill="#FFFFFF"/>
    <circle cx="25" cy="430" r="6" fill="#FFFFFF"/>
    <path d="M250 40 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2 z" fill="#F5C518"/>
    <path d="M520 120 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2 z" fill="#FFFFFF"/>
    <path d="M60 620 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2 z" fill="#F5C518"/>
  </g>

  <g filter="url(#sticker)">
    <!-- jump lines -->
    <g stroke="#F5C518" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <path d="M250 872 h-40"/><path d="M270 888 h-26"/>
      <path d="M400 860 h40"/><path d="M386 876 h26"/>
    </g>

    <!-- legs (star jump) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M265 610 Q230 700 200 772" stroke="#1E1B18" stroke-width="58"/>
      <path d="M265 610 Q230 700 200 772" stroke="#EFE6D2" stroke-width="48"/>
      <path d="M375 610 Q420 690 450 760" stroke="#1E1B18" stroke-width="58"/>
      <path d="M375 610 Q420 690 450 760" stroke="#EFE6D2" stroke-width="48"/>
      <path d="M250 650 Q236 690 222 720" stroke="#D8CDB8" stroke-width="6"/>
      <path d="M392 650 Q410 684 424 714" stroke="#D8CDB8" stroke-width="6"/>
    </g>
    <use href="#sock" transform="translate(198 786) rotate(22)"/>
    <use href="#sock" transform="translate(452 774) rotate(-22)"/>
    <use href="#shoe" transform="translate(186 818) rotate(18) scale(-1 1)"/>
    <use href="#shoe" transform="translate(466 806) rotate(-18)"/>

    <!-- arms raised -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 390 Q90 300 104 196" stroke="#1E1B18" stroke-width="58"/>
      <path d="M150 390 Q90 300 104 196" stroke="#EFE6D2" stroke-width="48"/>
      <path d="M490 390 Q550 300 536 196" stroke="#1E1B18" stroke-width="58"/>
      <path d="M490 390 Q550 300 536 196" stroke="#EFE6D2" stroke-width="48"/>
      <path d="M120 320 Q108 290 106 262" stroke="#D8CDB8" stroke-width="6"/>
      <path d="M520 320 Q532 290 534 262" stroke="#D8CDB8" stroke-width="6"/>
    </g>
    <use href="#cuff" transform="translate(104 190) rotate(-6)"/>
    <use href="#cuff" transform="translate(536 190) rotate(6)"/>
    <use href="#glove" transform="translate(102 160) rotate(-14)"/>
    <use href="#glove" transform="translate(538 160) rotate(14) scale(-1 1)"/>

    <!-- body: disc thickness + real logo -->
    <circle cx="328" cy="438" r="212" fill="#0E0E0E"/>
    <image href="logo.png" x="108" y="218" width="424" height="424"/>
    <!-- TCG: the only addition to the logo -->
    <text x="320" y="563" text-anchor="middle" font-family="Inter" font-weight="900" font-size="50" letter-spacing="3"
          fill="#FFFFFF" stroke="#141414" stroke-width="10" paint-order="stroke" stroke-linejoin="round">TCG</text>

    <!-- cap, slightly tilted -->
    <g transform="rotate(-12 320 226)" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round">
      <path d="M232 238 Q228 150 320 140 Q412 150 408 238 Z" fill="url(#capG)"/>
      <path d="M396 230 Q470 222 498 244 Q470 262 392 252 Z" fill="#F2B705"/>
      <path d="M320 142 Q300 190 304 238" fill="none" stroke="#D9A800" stroke-width="4"/>
      <path d="M320 142 Q352 190 356 236" fill="none" stroke="#D9A800" stroke-width="4"/>
      <ellipse cx="320" cy="140" rx="12" ry="7" fill="#F5C518"/>
      <path d="M228 238 L410 240" fill="none"/>
    </g>
  </g>
</svg>
