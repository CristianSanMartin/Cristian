  const W = 1080, H = 1920;
  const TINTS = ['#e3b43c', '#d9772f', '#8d5fd0', '#3d73c4', '#2f9e8f'];
  const TIERS = [
    { a: '#f6cd55', b: '#d8a42c', num: '#141005', border: '#e3b43c' },
    { a: '#eeeff1', b: '#8e9196', num: '#151515', border: '#a9acb1' },

  /* ---------- estado de la pantalla ---------- */
  const pref = {
    get(k, d) { try { return localStorage.getItem('story-' + k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('story-' + k, v); } catch (e) { /* sin almacenamiento: solo esta vez */ } },
  };
  const vacio = () => ({ id: '', nombrePila: '', apellido: '', w: 0, l: 0, t: 0, principal: '', secundario: '' });
  const st = { torneoId: null, ev: {}, top: [0, 1, 2, 3, 4].map(vacio), nombreModo: pref.get('nombre', 'first'), imgModo: pref.get('img', 'tint'), cambios: false };

  /** Carga el torneo elegido: datos del evento y los 5 primeros lugares con su récord y Pokémon. */
  function cargar(t) {
    st.torneoId = t ? t.id : '';
    st.ev = { tipoEvento: (t && t.tipoEvento) || 'Liga Pokémon', nombre: t ? t.nombre : '', temporada: (t && t.temporada) || '', categoria: (t && t.categoria) || 'Interno' };
    const js = t ? t.jugadores.slice().sort((a, b) => (a.lugar || 999) - (b.lugar || 999)) : [];
    st.top = [0, 1, 2, 3, 4].map((i) => {
      const j = js[i];
      if (!j) return vacio();
      const partes = j.nombre.split(/\s+/);
      return { id: j.id, nombrePila: j.nombrePila || partes[0] || '', apellido: j.nombrePila ? j.apellido : partes.slice(1).join(' '), w: j.w, l: j.l, t: j.t, principal: j.principal, secundario: j.secundario };
    });
    st.cambios = false;
  }

  /* ---------- imágenes de la biblioteca (solo las que se dibujan) ---------- */
  const imgs = {};
  const pedidas = {};
  const pokePorNombre = (n) => biblioteca().find((p) => GS.norm(p.nombre) === GS.norm(n || ''));
  const clave = (p) => p.id + '|' + p.version;
  function imagenDe(nombre) {
    const p = pokePorNombre(nombre);
    if (!p || !p.imagen) return null;
    const im = imgs[clave(p)];
    return im && im.complete && im.naturalWidth ? im : null;
  }
  function pedirImagenes() {
    const faltan = [];
    st.top.forEach((r) => [r.principal, r.secundario].forEach((n) => {
      const p = pokePorNombre(n);
      if (p && p.imagen && !imgs[clave(p)] && !pedidas[clave(p)] && faltan.indexOf(p) === -1) faltan.push(p);
    }));
    if (!faltan.length) return;
    faltan.forEach((p) => { pedidas[clave(p)] = true; });

      faltan.forEach((p) => {
        delete pedidas[clave(p)];
        if (!r.data[p.id]) return;
        const im = new Image();
        im.onload = () => { im.opaca = esOpaca(im); programar(); };
        im.src = r.data[p.id];
        imgs[clave(p)] = im;
      });
    }).catch((e) => { faltan.forEach((p) => { delete pedidas[clave(p)]; }); GS.toast(e.message, true); });
  }

  /**
   * ¿La imagen no tiene fondo transparente (ej. la ilustración de una carta)? Se revisa el borde en una
   * copia pequeña: si casi todo es opaco, la silueta saldría como un rectángulo de color, así que se
   * dibuja como foto.
   */
  function esOpaca(im) {
    const n = 48;
    const c = document.createElement('canvas');
    c.width = n; c.height = n;
    const o = c.getContext('2d');
    o.drawImage(im, 0, 0, n, n);
    const px = o.getImageData(0, 0, n, n).data;
    let borde = 0, opacos = 0;
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (x > 1 && x < n - 2 && y > 1 && y < n - 2) continue;
        borde++;
        if (px[(y * n + x) * 4 + 3] > 240) opacos++;
      }
    }
    return opacos / borde > 0.9;
  }

  function spaced(text, x, y, sp, align) {
    const chars = [...text], widths = chars.map((c) => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    const prev = ctx.textAlign; ctx.textAlign = 'left';
    chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i] + sp; });
    ctx.textAlign = prev; return total;
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

    let s = size; ctx.font = fam.replace('{s}', s);
    while (ctx.measureText(text).width > maxW && s > 20) { s -= 2; ctx.font = fam.replace('{s}', s); }
  }
  function displayName(p) {
    const mode = st.nombreModo;
    if (mode === 'full') return (p.nombrePila + ' ' + p.apellido).trim();

    return p.nombrePila;
  }
  function drawBackground() {
    ctx.fillStyle = '#101010'; ctx.fillRect(0, 0, W, H);
    const corner = (pts, from, to) => {
      const g = ctx.createLinearGradient(from[0], from[1], to[0], to[1]);
      g.addColorStop(0, 'rgba(201,160,62,0.85)'); g.addColorStop(1, 'rgba(201,160,62,0)');
      ctx.fillStyle = g; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
    };
    corner([[0, 0], [110, 0], [0, 120]], [0, 0], [90, 90]);
    corner([[0, 155], [150, 0], [168, 0], [0, 180]], [0, 0], [150, 150]);
    corner([[1080, 1590], [1080, 1640], [860, 1920], [810, 1920]], [1080, 1600], [880, 1880]);
    corner([[1080, 1760], [1080, 1800], [990, 1920], [950, 1920]], [1080, 1770], [980, 1900]);
    const cx = 830, cy = 255, R = 268;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 0); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.fillStyle = '#101010'; ctx.fillRect(cx - R, cy - 24, R * 2, 48);
    ctx.beginPath(); ctx.arc(cx, cy, 112, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 76, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // grano fijo: la imagen sale igual cada vez
    for (let i = 0; i < 1800; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
      ctx.fillStyle = 'rgba(0,0,0,' + rnd() * 0.25 + ')';
      ctx.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3, 3);
    }
    ctx.restore();
  }
  function drawHeader() {
    ctx.fillStyle = '#e8e8e8'; ctx.textBaseline = 'alphabetic';
    ctx.font = '600 30px Montserrat, Arial, sans-serif';
    const words = st.ev.tipoEvento.toUpperCase().trim().split(/\s+/);
    const l1 = words.length > 1 ? words.slice(0, -1).join(' ') : '', l2 = words[words.length - 1] || '';
    if (l1) spaced(l1, 76, 136, 15);
    const w2 = spaced(l2, 76, 167, 15);
    ctx.fillStyle = 'rgba(232,232,232,0.6)'; ctx.fillRect(76 + w2 + 12, 157, 210, 2);
    ctx.font = '230px Anton, Impact, sans-serif';
    ctx.fillStyle = '#e8e8e8'; ctx.fillText('TOP', 62, 380);
    const topW = ctx.measureText('TOP').width;
    ctx.fillStyle = '#e3b43c'; ctx.fillText('5', 62 + topW + 18, 380);
    ctx.fillStyle = '#e8e8e8';
    const ev = st.ev.nombre.toUpperCase().trim();
    ctx.font = '700 40px Montserrat, Arial, sans-serif';
    let sp = 17; while (ctx.measureText(ev).width + sp * (ev.length - 1) > 900 && sp > 4) sp--;
    spaced(ev, 64, 427, sp);
  }
  function tinted(im, dw, dh, tint) {
    const off = document.createElement('canvas'); off.width = dw; off.height = dh;
    const o = off.getContext('2d');
    o.drawImage(im, 0, 0, dw, dh);
    o.globalCompositeOperation = 'source-in';
    const g = o.createLinearGradient(0, 0, dw, 0);
    g.addColorStop(0, tint + '60'); g.addColorStop(0.5, tint + 'c8'); g.addColorStop(1, tint + 'f0');
    o.fillStyle = g; o.fillRect(0, 0, dw, dh);
    return off;
  }
  function drawSlot(poly, x0, x1, name, tint, i, h, y) {
    ctx.save();
    ctx.beginPath(); poly.forEach(([px, py], j) => (j ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.closePath(); ctx.clip();
    const im = imagenDe(name), cx = (x0 + x1) / 2, maxW = (x1 - x0) * 1.05;
    if (im && im.opaca) {
      // Imagen con fondo (ej. una carta): rellena el espacio como foto y se funde con la fila por la izquierda.
      const sw = Math.ceil(x1 - x0), k = Math.max(sw / im.naturalWidth, h / im.naturalHeight);
      const dw = im.naturalWidth * k, dh = im.naturalHeight * k;
      const off = document.createElement('canvas'); off.width = sw; off.height = h;
      const o = off.getContext('2d');
      o.drawImage(im, (sw - dw) / 2, (h - dh) / 2, dw, dh);
      const velo = o.createLinearGradient(0, 0, 0, h);
      velo.addColorStop(0, tint + '30'); velo.addColorStop(1, 'rgba(0,0,0,0.3)');
      o.fillStyle = velo; o.fillRect(0, 0, sw, h);
      o.globalCompositeOperation = 'destination-in';
      const fade = o.createLinearGradient(0, 0, sw * 0.5, 0);
      fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,0.92)');
      o.fillStyle = fade; o.fillRect(0, 0, sw, h);
      ctx.drawImage(off, x0, y);
    } else if (im) {
      let k = (h * 1.2) / im.naturalHeight;
      if (im.naturalWidth * k > maxW) k = maxW / im.naturalWidth;
      const dw = Math.round(im.naturalWidth * k), dh = Math.round(im.naturalHeight * k);
      const dx = Math.round(cx - dw / 2), dy = Math.round(y + h + 6 - dh);
      if (st.imgModo === 'tint') ctx.drawImage(tinted(im, dw, dh, tint), dx, dy);
      else { ctx.globalAlpha = 0.92; ctx.drawImage(im, dx, dy, dw, dh); }
    } else {
      const t = name.toUpperCase();
      fitFont(t, '{s}px Anton, Impact, sans-serif', 96, (x1 - x0) - 40);
      ctx.textAlign = 'center'; ctx.fillStyle = tint + (i === 0 ? '88' : '70');
      ctx.fillText(t, cx, y + h / 2 + 36);
    }
    ctx.restore();
  }
  function drawRow(i, p) {
    const x = 66, w = 950, h = 152, y = 576 + i * 200, r = 22;
    const T = TIERS[i], tint = TINTS[i];
    ctx.save();
    rr(x, y, w, h, r); ctx.clip();
    const body = ctx.createLinearGradient(x, y, x + w, y);
    body.addColorStop(0, '#14171a'); body.addColorStop(1, '#1b2024');
    ctx.fillStyle = body; ctx.fillRect(x, y, w, h);
    const glow = ctx.createRadialGradient(x + 700, y + h / 2, 10, x + 700, y + h / 2, 360);
    glow.addColorStop(0, tint + (i === 0 ? '55' : '40')); glow.addColorStop(1, tint + '00');
    ctx.fillStyle = glow; ctx.fillRect(x, y, w, h);
    if (p.principal) {
      const L = x + 430, R = x + w;
      if (p.secundario) {
        const sx = L + (R - L) * 0.65, sl = 30;
        drawSlot([[L, y], [sx + sl, y], [sx - sl, y + h], [L, y + h]], L, sx + sl, p.principal, tint, i, h, y);
        drawSlot([[sx + sl, y], [R, y], [R, y + h], [sx - sl, y + h]], sx - sl, R, p.secundario, tint, i, h, y);
        ctx.beginPath(); ctx.moveTo(sx + sl + 4, y - 2); ctx.lineTo(sx - sl - 4, y + h + 2);
        ctx.lineWidth = 9; ctx.strokeStyle = '#101214'; ctx.stroke();
        ctx.lineWidth = 2.5; ctx.strokeStyle = tint + 'cc'; ctx.stroke();
      } else {
        drawSlot([[L, y], [R, y], [R, y + h], [L, y + h]], L, R, p.principal, tint, i, h, y);
      }
    }
    const tg = ctx.createLinearGradient(x, y, x + 180, y + h);
    tg.addColorStop(0, T.a); tg.addColorStop(1, T.b);
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 170, y); ctx.lineTo(x + 136, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
    ctx.restore();
    rr(x, y, w, h, r); ctx.lineWidth = 3; ctx.strokeStyle = T.border + (i < 2 ? '' : 'aa'); ctx.stroke();
    ctx.font = '112px Anton, Impact, sans-serif'; ctx.fillStyle = T.num; ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), x + 76, y + h / 2 + 42); ctx.textAlign = 'left';
    if (i === 0) {
      const cx = x + 76, cy = y - 6;
      ctx.fillStyle = '#141005'; ctx.beginPath();
      ctx.moveTo(cx - 26, cy + 4); ctx.lineTo(cx - 28, cy - 22); ctx.lineTo(cx - 13, cy - 10); ctx.lineTo(cx, cy - 30);
      ctx.lineTo(cx + 13, cy - 10); ctx.lineTo(cx + 28, cy - 22); ctx.lineTo(cx + 26, cy + 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f6cd55'; ctx.beginPath();
      ctx.moveTo(cx - 22, cy); ctx.lineTo(cx - 23, cy - 15); ctx.lineTo(cx - 11, cy - 5); ctx.lineTo(cx, cy - 23);
      ctx.lineTo(cx + 11, cy - 5); ctx.lineTo(cx + 23, cy - 15); ctx.lineTo(cx + 22, cy); ctx.closePath(); ctx.fill();
    }
    const name = displayName(p).toUpperCase() || '—';
    fitFont(name, "800 {s}px 'Saira Condensed', 'Arial Narrow', sans-serif", 66, 215);
    ctx.fillStyle = '#f1f1f1'; ctx.fillText(name, x + 206, y + 74);
    ctx.font = '700 34px Montserrat, Arial, sans-serif';
    ctx.fillStyle = i === 0 ? '#e3b43c' : i === 2 ? '#c9935a' : '#c4c6ca';

  }
  function drawFooter() {
    ctx.font = '600 22px Montserrat, Arial, sans-serif'; ctx.fillStyle = '#cfd0d2';
    const tw = spaced(st.ev.temporada.toUpperCase().trim(), 540, 1593, 11, 'center');
    ctx.fillStyle = 'rgba(207,208,210,0.5)';
    ctx.fillRect(540 - tw / 2 - 112, 1584, 90, 2);
    ctx.fillRect(540 + tw / 2 + 22, 1584, 90, 2);
    if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, (W - logo.naturalWidth) / 2, 1638);
  }
  function dibujar() {
    const out = document.getElementById('story-out');
    if (!out) return;
    ctx.clearRect(0, 0, W, H);
    drawBackground(); drawHeader();
    st.top.forEach((p, i) => drawRow(i, p));
    drawFooter();
    out.src = cv.toDataURL('image/png');
  }
  let timer;
  function programar() { clearTimeout(timer); timer = setTimeout(dibujar, 120); }

  // Fuentes del diseño (Anton, Saira Condensed, Montserrat): se cargan la primera vez que se abre la pantalla.
  let fuentes = null;
  function cargarFuentes() {
    if (fuentes) return fuentes;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = FUENTES;
    document.head.appendChild(link);
    const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
    fuentes = Promise.race([espera(4000), new Promise((ok) => { link.onload = ok; link.onerror = ok; }).then(() => Promise.all([
      document.fonts.load('230px Anton'), document.fonts.load("800 66px 'Saira Condensed'"),
      document.fonts.load('700 40px Montserrat'), document.fonts.load('600 30px Montserrat'),
    ]))]).catch(() => {}).then(() => new Promise((ok) => { if (logo.complete) ok(); else { logo.onload = ok; logo.onerror = ok; } }));
    return fuentes;
  }

  /* ---------- pantalla ---------- */

  const opcionesPoke = (sel, vacioTxt) => {
    const nombres = biblioteca().map((p) => p.nombre);
    if (sel && !nombres.some((n) => GS.norm(n) === GS.norm(sel))) nombres.unshift(sel);
    return '<option value="">' + vacioTxt + '</option>' + nombres.map((n) => '<option value="' + esc(n) + '"' + (GS.norm(n) === GS.norm(sel) ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  };

  function filas() {
    return st.top.map((p, i) => '<tr' + (p.id ? '' : ' class="row-muted"') + '><td class="story-pos">' + (i + 1) + '</td>' +
      '<td class="story-txt"><input data-story="' + i + '|nombrePila" value="' + esc(p.nombrePila) + '" aria-label="Nombre ' + (i + 1) + '"' + (p.id ? '' : ' disabled') + '></td>' +
      '<td class="story-txt"><input data-story="' + i + '|apellido" value="' + esc(p.apellido) + '" aria-label="Apellido ' + (i + 1) + '"' + (p.id ? '' : ' disabled') + '></td>' +
      ['w', 'l', 't'].map((k) => '<td class="story-num"><input type="number" min="0" step="1" data-story="' + i + '|' + k + '" value="' + p[k] + '" aria-label="' + { w: 'Victorias', l: 'Derrotas', t: 'Empates' }[k] + ' ' + (i + 1) + '"' + (p.id ? '' : ' disabled') + '></td>').join('') +
      '<td><select data-story="' + i + '|principal" aria-label="Pokémon principal ' + (i + 1) + '"' + (p.id ? '' : ' disabled') + '>' + opcionesPoke(p.principal, 'Elegir…') + '</select></td>' +
      '<td><select data-story="' + i + '|secundario" aria-label="Pokémon secundario ' + (i + 1) + '"' + (p.id ? '' : ' disabled') + '>' + opcionesPoke(p.secundario, 'Ninguno') + '</select></td></tr>').join('');
  }

  function bibliotecaHtml() {
    const lib = biblioteca();
    return lib.length ? lib.map((p) => '<div class="story-poke" data-poke="' + esc(p.id) + '">' +
      (p.imagen ? '<img class="story-thumb" src="' + esc(GS.imagenUrl(p.imagen)) + '" alt="' + esc(p.nombre) + '" loading="lazy">' : '<span class="story-thumb vacia">Sin imagen</span>') +
      '<b>' + esc(p.nombre) + '</b>' +
      '<button type="button" class="story-editar" data-action="storyPokeMenu" data-id="' + esc(p.id) + '" aria-haspopup="true" aria-label="Editar ' + esc(p.nombre) + '">' + GS.icon('edit') + 'Editar</button></div>').join('')
      : '<p class="hint">La biblioteca está vacía. Agrega el primer Pokémon abajo.</p>';
  }

  /** Pestaña "Story Top 5" de Torneos: dibuja la pantalla en el contenedor. */
  GS.story = function (el) {
    const ts = torneos();
    if (st.torneoId === null || (st.torneoId && !ts.some((t) => t.id === st.torneoId))) cargar(ts[0]);
    const t = ts.find((x) => x.id === st.torneoId);
    const sinRecord = t && !t.tdf && t.jugadores.every((j) => !j.w && !j.l && !j.t);
    el.innerHTML =
      (!ts.length ? GS.empty('Sin torneos', 'Primero sube el .tdf del torneo en Torneos: de ahí salen los jugadores y su récord.', 'torneos') :
      '<div class="story-wrap" id="story"><div class="story-col">' +
        '<h3 class="section-title">1 · Torneo</h3><div class="panel story-card">' +
          '<div class="form-field"><label>Torneo</label><select data-story-torneo>' + ts.map((x) => '<option value="' + esc(x.id) + '"' + (x.id === st.torneoId ? ' selected' : '') + '>' + esc(fmt.date(x.fecha) + ' · ' + x.nombre + ' · ' + x.jugadores.length + ' jugadores') + '</option>').join('') + '</select></div>' +
          (sinRecord
            ? '<div class="notice warn">Este torneo se subió antes de guardar el récord: sube su <strong>.tdf</strong> para traer victorias, derrotas y empates (o escríbelos en la tabla). <button type="button" class="btn small" data-action="storyTdf">Subir .tdf de este torneo</button></div>'
            : '<p class="hint">' + (t && t.tdf ? '✓ El .tdf de este torneo está guardado en Drive.' : 'Este torneo no tiene el .tdf guardado. <a href="#" data-action="storyTdf">Subirlo</a>') + '</p>') +
          '<input type="file" id="story-tdf" accept=".tdf,.xml,text/xml" hidden>' +
        '</div>' +
        '<h3 class="section-title">2 · Datos del evento</h3><div class="panel story-card"><div class="form-grid">' +
          '<div class="form-field"><label>Tipo de evento</label><input data-story-ev="tipoEvento" maxlength="40" value="' + esc(st.ev.tipoEvento) + '"></div>' +
          '<div class="form-field"><label>Nombre del torneo (en la imagen)</label><input data-story-ev="nombre" maxlength="80" value="' + esc(st.ev.nombre) + '"></div>' +
          '<div class="form-field"><label>Temporada</label><input data-story-ev="temporada" maxlength="60" value="' + esc(st.ev.temporada) + '" placeholder="Ej.: Temporada 2026"></div>' +
          '<div class="form-field"><label>Categoría</label><select data-story-ev="categoria">' + GS.options(data().catalogos.categoriasTorneo, st.ev.categoria) + '</select></div>' +
          '<div class="form-field"><label>Nombre que se muestra</label><select data-story-modo="nombre">' + GS.options([{ value: 'first', label: 'Solo nombre' }, { value: 'initial', label: 'Nombre + inicial' }, { value: 'full', label: 'Nombre completo' }], st.nombreModo) + '</select></div>' +
          '<div class="form-field"><label>Cómo se muestra el Pokémon</label><select data-story-modo="img">' + GS.options([{ value: 'tint', label: 'Silueta del color de la fila' }, { value: 'original', label: 'Imagen original' }], st.imgModo) + '</select></div>' +
        '</div></div>' +
        '<h3 class="section-title">3 · Top 5 y Pokémon</h3><div class="panel story-card"><div class="table-wrap"><table class="data-table story-tabla"><thead><tr><th class="c-pos">#</th><th>Nombre</th><th>Apellido</th><th class="c-num center" title="Victorias">W</th><th class="c-num center" title="Derrotas">L</th><th class="c-num center" title="Empates">T</th><th>Pokémon principal</th><th>Secundario</th></tr></thead><tbody>' + filas() + '</tbody></table></div>' +
          '<p class="hint">Nombre, apellido y récord vienen del .tdf (TOM no guarda el mazo, por eso el Pokémon se elige aquí). Solo principal: ocupa todo el espacio; con secundario: 65/35 con corte inclinado. Un Pokémon sin imagen se muestra con su nombre.</p></div>' +
        '<h3 class="section-title">4 · Biblioteca de Pokémon</h3><div class="panel story-card">' +
          '<p class="hint">PNG con fondo transparente funciona mejor (sale como silueta del color de la fila). Una imagen con fondo, como la ilustración de una carta, se muestra completa como foto. Las imágenes se guardan en Drive y las ve todo el equipo.</p>' +
          '<div class="story-lib">' + bibliotecaHtml() + '</div>' +
          '<input type="file" id="story-poke-file" accept="image/png,image/webp,image/jpeg" hidden>' +
          '<div class="story-add"><input data-story-nuevo placeholder="Nombre del Pokémon" maxlength="40" aria-label="Nombre del Pokémon nuevo"><button type="button" class="btn secondary" data-action="storyPokeAgregar">' + GS.icon('plus', 2.4) + 'Agregar Pokémon</button></div>' +
        '</div>' +
      '</div>' +
      '<aside class="story-preview"><h3 class="section-title">Vista previa · 1080 × 1920</h3>' +
        '<div class="story-frame"><img id="story-out" alt="Vista previa de la Story del Top 5"></div>' +
        '<div class="story-actions"><button type="button" class="btn" data-action="storyDescargar">' + GS.icon('download') + 'Descargar PNG</button>' +
        '<button type="button" class="btn secondary" data-action="storyGuardar"' + (t ? '' : ' disabled') + '>' + GS.icon('check') + 'Guardar</button></div>' +
        '<p class="hint" data-story-estado>' + (st.cambios ? '<span class="text-gold">Cambios sin guardar.</span> ' : '') + 'Guardar deja el Pokémon y el récord de cada jugador en el torneo (sirve para los rankings de temporada).</p>' +
      '</aside></div>');
    pedirImagenes();

  const marcarCambios = () => {
    st.cambios = true;
    const e = document.querySelector('[data-story-estado]');
    if (e && !e.querySelector('.text-gold')) e.insertAdjacentHTML('afterbegin', '<span class="text-gold">Cambios sin guardar.</span> ');
  };

  document.addEventListener('input', (e) => {
    if (!e.target.closest || !e.target.closest('#story')) return;
    const d = e.target.dataset;
    if (d.story) {
      const [i, k] = d.story.split('|');
      st.top[+i][k] = ['w', 'l', 't'].indexOf(k) !== -1 ? Math.max(0, parseInt(e.target.value, 10) || 0) : e.target.value;
      if (k === 'principal' || k === 'secundario') pedirImagenes();
      marcarCambios();
    } else if (d.storyEv) {
      st.ev[d.storyEv] = e.target.value;
      if (d.storyEv !== 'nombre') marcarCambios();
    } else if (d.storyModo) {
      st[d.storyModo === 'nombre' ? 'nombreModo' : 'imgModo'] = e.target.value;
      pref.set(d.storyModo, e.target.value);
    } else return;
    programar();
  });
  document.addEventListener('change', (e) => {
    if (!e.target.closest || !e.target.closest('#story')) return;
    if (e.target.matches('[data-story-torneo]')) {
      cargar(torneos().find((t) => t.id === e.target.value));
      GS.render();
    } else if (e.target.id === 'story-tdf') subirTdf(e.target);
    else if (e.target.id === 'story-poke-file') subirImagen(e.target);
  });

  /* ---------- acciones ---------- */

  GS.actions.storyTdf = () => document.getElementById('story-tdf').click();
  async function subirTdf(input) {
    const f = input.files[0];
    input.value = '';
    if (!f) return;
    try {
      const tdf = GS.leerTdf(await f.text());
      const r = await GS.mutate('tdfTorneo', { id: st.torneoId, tdf: { nombre: f.name, texto: tdf.texto }, jugadores: tdf.jugadores },
        (x) => '.tdf guardado: récord de ' + x.jugadores + ' jugadores' + (x.sinCoincidir ? ' (' + x.sinCoincidir + ' sin coincidir por Player ID)' : ''));
      cargar(torneos().find((t) => t.id === r.id));
      GS.render();
    } catch (e) { GS.toast(e.message, true); }
  }

  GS.actions.storyGuardar = () => GS.mutate('storyTorneo', {
    id: st.torneoId, tipoEvento: st.ev.tipoEvento, temporada: st.ev.temporada, categoria: st.ev.categoria,
    jugadores: st.top.filter((p) => p.id).map((p) => ({ id: p.id, nombrePila: p.nombrePila, apellido: p.apellido, w: p.w, l: p.l, t: p.t, principal: p.principal, secundario: p.secundario })),
  }, 'Story guardada en el torneo').then(() => { st.cambios = false; GS.render(); }).catch((e) => GS.toast(e.message, true));

  GS.actions.storyDescargar = () => {
    dibujar();
    const slug = GS.norm(st.ev.nombre).replace(/[^\w]+/g, '-').replace(/^-|-$/g, '') || 'torneo';
    const t = torneos().find((x) => x.id === st.torneoId);
    cv.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'top5-' + slug + '-' + (t ? t.fecha : 'story') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      GS.toast('Imagen lista. Si la descarga no parte, haz clic derecho en la vista previa → Guardar imagen como…');
    }, 'image/png');
  };

  GS.actions.storyPokeAgregar = () => {
    const inp = document.querySelector('[data-story-nuevo]');
    const n = inp.value.trim();
    if (!n) { GS.toast('Escribe el nombre del Pokémon.', true); return; }
    GS.mutate('agregarPokemon', { nombre: n }, n + ' agregado: súbele una imagen con el botón ↑').catch((e) => GS.toast(e.message, true));
  };

  let destino = '';
  GS.actions.storyPokeImagen = (id) => { destino = id; document.getElementById('story-poke-file').click(); };
  /** Reduce la imagen (máx. 700 × 520, como la usa la Story) y la sube como PNG, conservando la transparencia. */
  function subirImagen(input) {
    const f = input.files[0];
    input.value = '';
    if (!f || !destino) return;
    const lector = new FileReader();
    lector.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 520 / im.naturalHeight, 700 / im.naturalWidth);
        const c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const p = biblioteca().find((x) => x.id === destino);
        GS.mutate('imagenPokemon', { id: destino, archivo: { mime: 'image/png', base64: c.toDataURL('image/png').split(',')[1] } }, 'Imagen guardada para ' + (p ? p.nombre : destino))
          .catch((e) => GS.toast(e.message, true));
      };
      im.onerror = () => GS.toast('No se pudo abrir la imagen. Prueba con un PNG, WEBP o JPG.', true);
      im.src = lector.result;
    };
    lector.readAsDataURL(f);
  }
  /* Menú "Editar" de cada Pokémon: subir o cambiar imagen, eliminar imagen, editar nombre y eliminar todo. */
  const cerrarMenu = () => document.querySelectorAll('.story-menu').forEach((m) => m.remove());
  GS.actions.storyPokeMenu = (id) => {
    const abierto = document.querySelector('.story-menu[data-menu="' + id + '"]');
    cerrarMenu();
    if (abierto) return;
    const p = biblioteca().find((x) => x.id === id);
    const card = document.querySelector('.story-poke[data-poke="' + id + '"]');
    if (!p || !card) return;
    const op = (accion, txt, cls) => '<button type="button" role="menuitem" class="' + (cls || '') + '" data-action="' + accion + '" data-id="' + esc(id) + '">' + txt + '</button>';
    card.insertAdjacentHTML('beforeend', '<div class="story-menu" role="menu" data-menu="' + esc(id) + '">' +
      op('storyPokeImagen', p.imagen ? 'Cambiar imagen' : 'Subir imagen') +
      (p.imagen ? op('storyPokeQuitar', 'Eliminar imagen') : '') +
      op('storyPokeNombre', 'Editar nombre') +
      op('storyPokeEliminar', 'Eliminar todo', 'text-danger') + '</div>');
  };
  // Clic afuera o en una opción cierra el menú (la opción ya se ejecutó: este listener va después del de acciones).
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-action="storyPokeMenu"]') && (!e.target.closest('.story-menu') || e.target.closest('.story-menu [data-action]'))) cerrarMenu();
  });
  GS.actions.storyPokeNombre = (id) => {
    const p = biblioteca().find((x) => x.id === id);
    GS.formModal({
      title: 'Editar nombre',
      submitLabel: 'Guardar',
      fields: () => '<div class="form-field"><label>Nombre del Pokémon *</label><input name="nombre" maxlength="40" value="' + esc(p.nombre) + '"></div>' +
        '<p class="hint">Los torneos que ya lo tienen elegido pasan al nombre nuevo.</p>',
      onSubmit: (v) => GS.mutate('renombrarPokemon', { id: id, nombre: v.nombre }, (r) => 'Nombre cambiado a ' + r.nombre).then((r) => {
        // Lo elegido en pantalla (aún sin guardar) también sigue al nombre nuevo.
        if (r.antes) st.top.forEach((x) => ['principal', 'secundario'].forEach((k) => { if (GS.norm(x[k]) === GS.norm(r.antes)) x[k] = r.nombre; }));
        GS.render();
      }),
    });
  };
  GS.actions.storyPokeQuitar = (id) => {
    const p = biblioteca().find((x) => x.id === id);
    GS.mutate('imagenPokemon', { id: id, quitar: true }, 'Imagen quitada de ' + (p ? p.nombre : id)).catch((e) => GS.toast(e.message, true));
  };
  GS.actions.storyPokeEliminar = (id) => {
    const p = biblioteca().find((x) => x.id === id);
    GS.confirm({
      title: 'Eliminar ' + (p ? p.nombre : id), danger: true, confirmLabel: 'Eliminar',
      message: 'Se quita de la biblioteca (y su imagen va a la papelera de Drive). Los torneos que ya lo tienen guardado conservan el nombre.',
      onConfirm: () => GS.mutate('eliminarPokemon', { id: id }, (p ? p.nombre : id) + ' eliminado'),
    });
  };
})();
</script>
