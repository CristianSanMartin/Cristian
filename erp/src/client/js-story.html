  const W = 1080, H = 1920;
  const TINTS = ['#e3b43c', '#d9772f', '#8d5fd0', '#3d73c4', '#2f9e8f'];
  const TIERS = [
    { a: '#f6cd55', b: '#d8a42c', num: '#141005', border: '#e3b43c' },
    { a: '#eeeff1', b: '#8e9196', num: '#151515', border: '#a9acb1' },
    { a: '#d79a64', b: '#87532c', num: '#141008', border: '#8a6ab8' },

  ];
  const FUENTES = 'https://fonts.googleapis.com/css2?family=Anton&family=Saira+Condensed:wght@600;800&family=Montserrat:wght@600;700&display=swap';

  /* ---------- estado de la pantalla ---------- */
  const pref = {
    get(k, d) { try { return localStorage.getItem('story-' + k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('story-' + k, v); } catch (e) { /* sin almacenamiento: solo esta vez */ } },
  };
  const vacio = () => ({ id: '', nombrePila: '', apellido: '', w: 0, l: 0, t: 0, principal: '', secundario: '' });
  const st = { torneoId: null, ev: {}, top: [0, 1, 2, 3, 4].map(vacio), nombreModo: pref.get('nombreModo', 'full'), imgModo: pref.get('img', 'tint'), cambios: false };

  /** Carga el torneo elegido: datos del evento y los 5 primeros lugares con su récord y Pokémon. */
  function cargar(t) {
    st.torneoId = t ? t.id : '';
    st.ev = { tipoEvento: (t && t.tipoEvento) || 'Liga Pokémon', nombre: t ? t.nombre : '', temporada: (t && t.temporada) || GS.temporadaPorDefecto(), categoria: (t && t.categoria) || 'Interno' };
    const js = t ? t.jugadores.slice().sort((a, b) => (a.lugar || 999) - (b.lugar || 999)) : [];
    st.top = [0, 1, 2, 3, 4].map((i) => {
      const j = js[i];
      if (!j) return vacio();
      const partes = j.nombre.split(/\s+/);
      return { id: j.id, nombrePila: j.nombrePila || partes[0] || '', apellido: j.nombrePila ? j.apellido : partes.slice(1).join(' '), w: j.w, l: j.l, t: j.t, principal: j.principal, secundario: j.secundario };
    });
    st.cambios = false;
    st.version = t ? t.actualizadoEn : '';
  }

  /* ---------- imágenes de la biblioteca (solo las que se dibujan) ---------- */
  const imgs = {};
  const pedidas = {};
  const pokePorNombre = (n) => biblioteca().find((p) => GS.norm(p.nombre) === GS.norm(n || ''));
  const clave = (p) => p.id + '|' + p.version;
  function imagenDe(nombre) {
    const p = pokePorNombre(nombre);
    if (!p || !p.imagen) return null;
    const im = imgs[clave(p)];
    return im && im.complete && im.naturalWidth ? im : null;
  }
  function pedirImagenes() {
    const faltan = [];
    st.top.forEach((r) => [r.principal, r.secundario].forEach((n) => {
      const p = pokePorNombre(n);
      if (p && p.imagen && !imgs[clave(p)] && !pedidas[clave(p)] && faltan.indexOf(p) === -1) faltan.push(p);
    }));
    if (!faltan.length) return;
    faltan.forEach((p) => { pedidas[clave(p)] = true; });
    GS.api('imagenesPokemon', { ids: faltan.map((p) => p.id) }).then((r) => {
      faltan.forEach((p) => {
        delete pedidas[clave(p)];
        if (!r.data[p.id]) return;
        const im = new Image();
        im.onload = () => { im.opaca = esOpaca(im); programar(); };
        im.src = r.data[p.id];
        imgs[clave(p)] = im;
      });
    }).catch((e) => { faltan.forEach((p) => { delete pedidas[clave(p)]; }); GS.toast(e.message, true); });
  }

  /**
   * ¿La imagen no tiene fondo transparente (ej. la ilustración de una carta)? Se revisa el borde en una
   * copia pequeña: si casi todo es opaco, la silueta saldría como un rectángulo de color, así que se
   * dibuja como foto.
   */
  function esOpaca(im) {
    const n = 48;
    const c = document.createElement('canvas');
    c.width = n; c.height = n;
    const o = c.getContext('2d');
    o.drawImage(im, 0, 0, n, n);

  /* ---------- dibujo de la Story (igual al diseño original) ---------- */
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const logo = new Image();
  logo.src = LOGO;

  function spaced(text, x, y, sp, align) {
    const chars = [...text], widths = chars.map((c) => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;

  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function fitFont(text, fam, size, maxW) {
    let s = size; ctx.font = fam.replace('{s}', s);

  }
  function displayName(p) {
    const mode = st.nombreModo;
    if (mode === 'full') return (p.nombrePila + ' ' + p.apellido).trim();

  }
  function drawBackground() {
    ctx.fillStyle = '#101010'; ctx.fillRect(0, 0, W, H);
    const corner = (pts, from, to) => {
      const g = ctx.createLinearGradient(from[0], from[1], to[0], to[1]);
      g.addColorStop(0, 'rgba(201,160,62,0.85)'); g.addColorStop(1, 'rgba(201,160,62,0)');
      ctx.fillStyle = g; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
    };

    corner([[0, 155], [150, 0], [168, 0], [0, 180]], [0, 0], [150, 150]);
    corner([[1080, 1590], [1080, 1640], [860, 1920], [810, 1920]], [1080, 1600], [880, 1880]);
    corner([[1080, 1760], [1080, 1800], [990, 1920], [950, 1920]], [1080, 1770], [980, 1900]);

    ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 0); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
    ctx.fillStyle = '#101010'; ctx.fillRect(cx - R, cy - 24, R * 2, 48);
    ctx.beginPath(); ctx.arc(cx, cy, 112, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 76, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // grano fijo: la imagen sale igual cada vez
    for (let i = 0; i < 1800; i++) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * R;
      ctx.fillStyle = 'rgba(0,0,0,' + rnd() * 0.25 + ')';
      ctx.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3, 3);
    }
    ctx.restore();
  }
  function drawHeader() {
    ctx.fillStyle = '#e8e8e8'; ctx.textBaseline = 'alphabetic';
    ctx.font = '600 30px Montserrat, Arial, sans-serif';
    const words = st.ev.tipoEvento.toUpperCase().trim().split(/\s+/);
    const l1 = words.length > 1 ? words.slice(0, -1).join(' ') : '', l2 = words[words.length - 1] || '';
    if (l1) spaced(l1, 76, 136, 15);
    const w2 = spaced(l2, 76, 167, 15);
    ctx.fillStyle = 'rgba(232,232,232,0.6)'; ctx.fillRect(76 + w2 + 12, 157, 210, 2);
    ctx.font = '230px Anton, Impact, sans-serif';
    ctx.fillStyle = '#e8e8e8'; ctx.fillText('TOP', 62, 380);
    const topW = ctx.measureText('TOP').width;
    ctx.fillStyle = '#e3b43c'; ctx.fillText('5', 62 + topW + 18, 380);
    ctx.fillStyle = '#e8e8e8';
    const ev = st.ev.nombre.toUpperCase().trim();
    ctx.font = '700 40px Montserrat, Arial, sans-serif';
    let sp = 17; while (ctx.measureText(ev).width + sp * (ev.length - 1) > 900 && sp > 4) sp--;

  }
  function tinted(im, dw, dh, tint) {
    const off = document.createElement('canvas'); off.width = dw; off.height = dh;
    const o = off.getContext('2d');
    o.drawImage(im, 0, 0, dw, dh);
    o.globalCompositeOperation = 'source-in';
    const g = o.createLinearGradient(0, 0, dw, 0);
    g.addColorStop(0, tint + '60'); g.addColorStop(0.5, tint + 'c8'); g.addColorStop(1, tint + 'f0');
    o.fillStyle = g; o.fillRect(0, 0, dw, dh);

  }
  function drawSlot(poly, x0, x1, name, tint, i, h, y) {
    ctx.save();
    ctx.beginPath(); poly.forEach(([px, py], j) => (j ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.closePath(); ctx.clip();
    const im = imagenDe(name), cx = (x0 + x1) / 2, maxW = (x1 - x0) * 1.05;
    if (im && im.opaca) {
      // Imagen con fondo (ej. una carta): rellena el espacio como foto y se funde con la fila por la izquierda.
      const sw = Math.ceil(x1 - x0), k = Math.max(sw / im.naturalWidth, h / im.naturalHeight);
      const dw = im.naturalWidth * k, dh = im.naturalHeight * k;
      const off = document.createElement('canvas'); off.width = sw; off.height = h;
      const o = off.getContext('2d');
      o.drawImage(im, (sw - dw) / 2, (h - dh) / 2, dw, dh);

      velo.addColorStop(0, tint + '30'); velo.addColorStop(1, 'rgba(0,0,0,0.3)');
      o.fillStyle = velo; o.fillRect(0, 0, sw, h);

      fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,0.92)');
      o.fillStyle = fade; o.fillRect(0, 0, sw, h);

    } else if (im) {
      let k = (h * 1.2) / im.naturalHeight;
      if (im.naturalWidth * k > maxW) k = maxW / im.naturalWidth;
      const dw = Math.round(im.naturalWidth * k), dh = Math.round(im.naturalHeight * k);
      const dx = Math.round(cx - dw / 2), dy = Math.round(y + h + 6 - dh);
      if (st.imgModo === 'tint') ctx.drawImage(tinted(im, dw, dh, tint), dx, dy);
      else { ctx.globalAlpha = 0.92; ctx.drawImage(im, dx, dy, dw, dh); }
    } else {
      const t = name.toUpperCase();
      fitFont(t, '{s}px Anton, Impact, sans-serif', 96, (x1 - x0) - 40);
      ctx.textAlign = 'center'; ctx.fillStyle = tint + (i === 0 ? '88' : '70');
      ctx.fillText(t, cx, y + h / 2 + 36);
    }
    ctx.restore();
  }
  function drawRow(i, p) {
    const x = 66, w = 950, h = 152, y = 576 + i * 200, r = 22;
    const T = TIERS[i], tint = TINTS[i];
    ctx.save();
    rr(x, y, w, h, r); ctx.clip();

    ctx.fillStyle = glow; ctx.fillRect(x, y, w, h);

      const L = x + 430, R = x + w;

        const sx = L + (R - L) * 0.65, sl = 30;

  }
  function drawFooter() {

  // Fuentes del diseño (Anton, Saira Condensed, Montserrat): se cargan la primera vez que se abre la pantalla.
  let fuentes = null;
  function cargarFuentes() {

  GS.actions.storyGuardar = () => GS.mutate('storyTorneo', {
    id: st.torneoId, tipoEvento: st.ev.tipoEvento, temporada: st.ev.temporada, categoria: st.ev.categoria,
    jugadores: st.top.filter((p) => p.id).map((p) => ({ id: p.id, nombrePila: p.nombrePila, apellido: p.apellido, w: p.w, l: p.l, t: p.t, principal: p.principal, secundario: p.secundario })),
  }, 'Story guardada en el torneo').then(() => { st.cambios = false; GS.render(); }).catch((e) => GS.toast(e.message, true));

  GS.actions.storyDescargar = () => {
    dibujar();
    const slug = GS.norm(st.ev.nombre).replace(/[^\w]+/g, '-').replace(/^-|-$/g, '') || 'torneo';
    const t = torneos().find((x) => x.id === st.torneoId);
    cv.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'top5-' + slug + '-' + (t ? t.fecha : 'story') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      GS.toast('Imagen lista. Si la descarga no parte, haz clic derecho en la vista previa → Guardar imagen como…');
    }, 'image/png');
  };

  GS.actions.storyPokeAgregar = () => {
    const inp = document.querySelector('[data-story-nuevo]');
    const n = inp.value.trim();
    if (!n) { GS.toast('Escribe el nombre del Pokémon.', true); return; }
    GS.mutate('agregarPokemon', { nombre: n }, n + ' agregado: súbele una imagen con el botón ↑').catch((e) => GS.toast(e.message, true));
  };

  let destino = '';
  GS.actions.storyPokeImagen = (id) => { destino = id; document.getElementById('story-poke-file').click(); };
  /** Reduce la imagen (máx. 700 × 520, como la usa la Story) y la sube como PNG, conservando la transparencia. */
  function subirImagen(input) {
    const f = input.files[0];
    input.value = '';
    if (!f || !destino) return;
    const lector = new FileReader();
    lector.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 520 / im.naturalHeight, 700 / im.naturalWidth);
        const c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const p = biblioteca().find((x) => x.id === destino);
        GS.mutate('imagenPokemon', { id: destino, archivo: { mime: 'image/png', base64: c.toDataURL('image/png').split(',')[1] } }, 'Imagen guardada para ' + (p ? p.nombre : destino))
          .catch((e) => GS.toast(e.message, true));
      };
      im.onerror = () => GS.toast('No se pudo abrir la imagen. Prueba con un PNG, WEBP o JPG.', true);
      im.src = lector.result;
    };
    lector.readAsDataURL(f);
  }
  /* Menú "Editar" de cada Pokémon: subir o cambiar imagen, eliminar imagen, editar nombre y eliminar todo. */
  const cerrarMenu = () => document.querySelectorAll('.story-menu').forEach((m) => m.remove());
  GS.actions.storyPokeMenu = (id) => {
    const abierto = document.querySelector('.story-menu[data-menu="' + id + '"]');
    cerrarMenu();
    if (abierto) return;
    const p = biblioteca().find((x) => x.id === id);
    const card = document.querySelector('.story-poke[data-poke="' + id + '"]');
    if (!p || !card) return;
    const op = (accion, txt, cls) => '<button type="button" role="menuitem" class="' + (cls || '') + '" data-action="' + accion + '" data-id="' + esc(id) + '">' + txt + '</button>';
    card.insertAdjacentHTML('beforeend', '<div class="story-menu" role="menu" data-menu="' + esc(id) + '">' +
      op('storyPokeImagen', p.imagen ? 'Cambiar imagen' : 'Subir imagen') +
      (p.imagen ? op('storyPokeQuitar', 'Eliminar imagen') : '') +
      op('storyPokeNombre', 'Editar nombre') +
      op('storyPokeEliminar', 'Eliminar todo', 'text-danger') + '</div>');
  };
  // Clic afuera o en una opción cierra el menú (la opción ya se ejecutó: este listener va después del de acciones).
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-action="storyPokeMenu"]') && (!e.target.closest('.story-menu') || e.target.closest('.story-menu [data-action]'))) cerrarMenu();
  });
  GS.actions.storyPokeNombre = (id) => {
    const p = biblioteca().find((x) => x.id === id);
    GS.formModal({
      title: 'Editar nombre',
      submitLabel: 'Guardar',
      fields: () => '<div class="form-field"><label>Nombre del Pokémon *</label><input name="nombre" maxlength="40" value="' + esc(p.nombre) + '"></div>' +
        '<p class="hint">Los torneos que ya lo tienen elegido pasan al nombre nuevo.</p>',
      onSubmit: (v) => GS.mutate('renombrarPokemon', { id: id, nombre: v.nombre }, (r) => 'Nombre cambiado a ' + r.nombre).then((r) => {
        // Lo elegido en pantalla (aún sin guardar) también sigue al nombre nuevo.
        if (r.antes) st.top.forEach((x) => ['principal', 'secundario'].forEach((k) => { if (GS.norm(x[k]) === GS.norm(r.antes)) x[k] = r.nombre; }));
        GS.render();
      }),
    });
  };
  GS.actions.storyPokeQuitar = (id) => {
    const p = biblioteca().find((x) => x.id === id);
    GS.mutate('imagenPokemon', { id: id, quitar: true }, 'Imagen quitada de ' + (p ? p.nombre : id)).catch((e) => GS.toast(e.message, true));
  };
  GS.actions.storyPokeEliminar = (id) => {
    const p = biblioteca().find((x) => x.id === id);
    GS.confirm({
      title: 'Eliminar ' + (p ? p.nombre : id), danger: true, confirmLabel: 'Eliminar',
      message: 'Se quita de la biblioteca (y su imagen va a la papelera de Drive). Los torneos que ya lo tienen guardado conservan el nombre.',
      onConfirm: () => GS.mutate('eliminarPokemon', { id: id }, (p ? p.nombre : id) + ' eliminado'),
    });
  };
})();
</script>
