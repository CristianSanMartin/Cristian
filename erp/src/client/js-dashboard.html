<script>
/* =========================================================
   Dashboard: próximos lanzamientos, asignaciones pendientes
   y compromiso con proveedores.
========================================================= */
(function () {
  'use strict';
  const { fmt, esc } = GS;

  function kpi(label, value, sub, cls) {
    return '<div class="kpi-card ' + (cls || '') + '"><div class="kpi-label">' + label + '</div>' +
      '<div class="kpi-value">' + value + '</div><div class="kpi-sub">' + (sub || '') + '</div></div>';
  }

  // Dinero: saldo de Finanzas por cuenta, lo que TUU aún no abona, cuotas y deudas de clientes.
  function dinero() {
    const r = GS.resumenDinero();
    const a = r.abierta;
    const neg = (n) => (n < 0 ? 'text-danger' : '');
    return '<div class="dash-titulo"><h3>Dinero</h3></div>' +
      '<div class="kpi-grid dinero">' +
      kpi('Saldo disponible', '<span class="' + (neg(r.saldo) || 'text-gold') + '">' + fmt.money(r.saldo) + '</span>', 'Ingresos − egresos registrados' + (a ? ' + caja abierta' : '')) +
      '<div class="kpi-clic" data-action="verPorAbonar" title="Ver pagos con tarjeta que TUU aún no abona">' + kpi('Por abonar (TUU)', fmt.money(r.porAbonar), r.nPorAbonar + (r.nPorAbonar === 1 ? ' pago' : ' pagos') + ' sin confirmar' + (r.cuotas ? ' · + ' + fmt.money(r.cuotas) + ' en cuotas' : '') + ' · ' + (verAbonar ? 'ocultar ▴' : 'ver ▾')) + '</div>' +
      '<div class="kpi-clic" data-action="verPorPagar" title="Ver facturas pendientes de pago">' + kpi('Facturas por pagar', '<span class="' + (r.porPagar ? 'text-danger' : '') + '">' + fmt.money(r.porPagar) + '</span>', (r.nPorPagar
        ? r.nPorPagar + (r.nPorPagar === 1 ? ' factura de compra' : ' facturas de compra') + ' · la más antigua del ' + fmt.date(r.pagarDesde)
        : 'Todas pagadas') + ' · ' + (verPagar ? 'ocultar ▴' : 'ver ▾')) + '</div>' +
      '<div class="kpi-clic" data-action="verPorCobrar" title="Ver quién debe">' + kpi('Por cobrar a clientes', fmt.money(r.porCobrar), (r.nPorCobrar ? r.nPorCobrar + (r.nPorCobrar === 1 ? ' venta con deuda' : ' ventas con deuda') : 'Nadie debe') + ' · ' + (verCobrar ? 'ocultar ▴' : 'ver ▾')) + '</div>' +
      '</div>' +
      (verAbonar ? '<div class="panel" style="margin:-8px 0 20px;"><div class="panel-head"><h3>Por abonar (TUU)</h3><a href="#" class="tag" data-action="irAbonosTuu">Ver en Caja → Abonos TUU →</a></div><div class="panel-body">' + tablaPorAbonar(r) + '</div></div>' : '') +
      (verPagar ? '<div class="panel" style="margin:-8px 0 20px;"><div class="panel-head"><h3>Facturas por pagar</h3><a href="#" class="tag" data-nav="compras">Ver en Compras →</a></div><div class="panel-body">' + tablaPorPagar() + '</div></div>' : '') +
      (verCobrar ? '<div class="panel" style="margin:-8px 0 20px;"><div class="panel-head"><h3>Cuentas por cobrar</h3><a href="#" class="tag" data-action="irCuentasPorCobrar">Ver todo en Finanzas →</a></div><div class="panel-body">' + GS.tablaPorCobrar({ max: 8 }) + '</div></div>' : '') +
      (a ? '<p class="table-note" style="margin:-4px 0 12px;">Caja abierta del ' + a.fechas.map(fmt.date).join(', ') + ': ' + a.tickets + ' tickets aún no pasan a Finanzas (efectivo ' + fmt.money(a.efectivo) + ', banco ' + fmt.money(a.banco) + ', TUU neto estimado ' + fmt.money(a.tuu) + ').</p>' : '');
  }

  /** Facturas de compra con saldo por pagar, de la más antigua a la más nueva, con el botón para registrar un abono. */
  function tablaPorPagar() {
    const d = GS.state.data;
    const hoy = new Date(d.hoy + 'T12:00:00Z');
    const lista = d.compras.filter((c) => c.porPagar > 1).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    if (!lista.length) return GS.empty('Todas pagadas', 'No hay facturas de compra con saldo pendiente.', 'compras');
    const dias = (f) => Math.max(0, Math.round((hoy - new Date(f + 'T12:00:00Z')) / 86400000));
    const op = GS.puede('operador');
    return '<div class="table-wrap"><table class="data-table"><thead><tr><th>Factura</th><th>Proveedor</th><th>Fecha</th><th class="right">Total</th><th class="right">Pagado</th><th class="right">Por pagar</th><th></th></tr></thead><tbody>' +
      lista.map((c) => {
        const n = dias(c.fecha);
        return '<tr><td><div class="cell-strong">' + esc(c.factura) + '</div><div class="cell-dim">' + esc(c.id) + '</div></td><td>' + esc(c.proveedor) + '</td>' +
          '<td class="nowrap">' + fmt.date(c.fecha) + '<div class="cell-dim ' + (n > 30 ? 'text-danger' : n >= 7 ? 'text-gold' : '') + '">' + (n === 0 ? 'hoy' : n + ' días') + '</div></td>' +
          '<td class="cell-num right">' + fmt.money(c.total) + '</td><td class="cell-num right">' + (c.pagado ? fmt.money(c.pagado) : '—') + '</td>' +
          '<td class="cell-num right"><strong class="text-danger">' + fmt.money(c.porPagar) + '</strong></td>' +
          '<td>' + (op ? '<button class="btn small secondary" data-action="registrarPagoCompra" data-id="' + esc(c.id) + '">Abonar</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /** Pagos con débito/crédito que TUU aún no abona (neto de comisión) y cuotas pendientes, por fecha de abono. */
  function tablaPorAbonar(r) {
    if (!r.abonos.length && !r.listaCuotas.length) return GS.empty('Todo abonado', 'No hay pagos con tarjeta pendientes de abono.', 'money');
    const hoy = GS.state.data.hoy;
    const abono = (f) => (f ? '<span class="' + (f < hoy ? 'text-danger' : f === hoy ? 'text-gold' : '') + '">' + fmt.date(f) + (f < hoy ? ' · atrasado' : f === hoy ? ' · hoy' : '') + '</span>' : '<span class="cell-dim">al cerrar la caja</span>');
    const lista = r.abonos.slice().sort((a, b) => String(a.abono || '9999').localeCompare(String(b.abono || '9999')) || String(a.fecha).localeCompare(String(b.fecha)));
    return (lista.length ? '<div class="table-wrap"><table class="data-table"><thead><tr><th>Abono esperado</th><th>Venta</th><th>Documento</th><th>Detalle</th><th class="right">Pagado</th><th class="right">Comisión</th><th class="right">Por abonar</th></tr></thead><tbody>' +
      lista.map((x) => '<tr><td class="nowrap">' + abono(x.abono) + '</td><td class="nowrap">' + fmt.date(x.fecha) + '</td><td class="cell-strong">' + esc(x.ref || '') + '</td>' +
        '<td>' + esc(x.detalle || '') + (x.medio ? '<div class="cell-dim">' + esc(x.medio) + '</div>' : '') + '</td>' +
        '<td class="cell-num right">' + fmt.money(x.bruto) + '</td><td class="cell-num right">' + (x.comision ? '−' + fmt.money(x.comision) : '—') + '</td>' +
        '<td class="cell-num right"><strong>' + fmt.money(x.neto) + '</strong></td></tr>').join('') +
      '</tbody><tfoot><tr><td colspan="6" class="right">Total por abonar</td><td class="cell-num right"><strong class="text-gold">' + fmt.money(r.porAbonar) + '</strong></td></tr></tfoot></table></div>' : '') +
      (r.listaCuotas.length ? '<h4 class="section-title" style="margin-top:14px;">Cuotas pendientes · ' + fmt.money(r.cuotas) + '</h4><div class="table-wrap"><table class="data-table"><thead><tr><th>Abono esperado</th><th>Ticket</th><th class="center">Cuota</th><th class="right">Monto</th></tr></thead><tbody>' +
        r.listaCuotas.map((c) => '<tr><td class="nowrap">' + abono(c.fechaEsperada) + '</td><td class="cell-strong">' + esc(c.ticketId) + '</td><td class="center">' + c.numero + ' de ' + c.de + '</td><td class="cell-num right">' + fmt.money(c.monto) + '</td></tr>').join('') +
        '</tbody></table></div>' : '') +
      '<p class="table-note">Los montos ya descuentan la comisión estimada de TUU; se confirman al subir el informe de abono en Caja del día → Abonos TUU.</p>';
  }

  let verAbonar = false;
  GS.actions.verPorAbonar = () => { verAbonar = !verAbonar; GS.render(); };
  GS.actions.irAbonosTuu = () => { GS.filters('caja', { caja: '', tab: 'caja' }).tab = 'tuu'; GS.go('caja'); };
  let verPagar = false;
  GS.actions.verPorPagar = () => { verPagar = !verPagar; GS.render(); };
  let verCobrar = false;
  GS.actions.verPorCobrar = () => { verCobrar = !verCobrar; GS.render(); };
  GS.actions.irCuentasPorCobrar = () => { GS.closeModals(); GS.filters('finanzas', { tab: 'movimientos', anio: '', q: '' }).tab = 'cobrar'; GS.go('finanzas'); };

  GS.views.dashboard = {
    title: 'Dashboard',
    render(el, d) {
      const iva = (n) => n * (1 + d.app.iva);
      const activas = d.preventas.filter((p) => ['solicitada', 'asignada'].indexOf(p.estado) !== -1);
      const porAsignar = activas.filter((p) => p.estado === 'solicitada');
      const asignadas = activas.filter((p) => p.estado === 'asignada');
      const compromiso = asignadas.reduce((s, p) => s + p.netoAsignado, 0);
      const ganancia = activas.reduce((s, p) => s + p.gananciaTotal, 0);

      // Próximos pedidos: uno por proveedor y fecha de lanzamiento.
      const pedidos = {};
      activas.filter((p) => p.lanzamiento >= d.hoy).forEach((p) => {
        const k = p.lanzamiento + '|' + p.proveedorId;
        const x = pedidos[k] || (pedidos[k] = { fecha: p.lanzamiento, proveedorId: p.proveedorId, proveedor: p.proveedor, productos: 0, neto: 0, ediciones: new Set() });
        x.productos++;
        x.neto += p.netoVigente;
        if (p.edicion) x.ediciones.add(p.edicion);
      });
      const lista = Object.values(pedidos).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
      const despacho = (x) => {
        const prov = d.proveedores.find((p) => p.id === x.proveedorId);
        if (!prov || !prov.despachoMonto) return '—';
        if (prov.despachoUmbral && x.neto >= prov.despachoUmbral) return '<span class="text-success">Gratis</span>';
        return '<span class="text-gold">' + fmt.money(prov.despachoMonto) + '</span>' + (prov.despachoUmbral ? '<div class="cell-dim">faltan ' + fmt.money(prov.despachoUmbral - x.neto) + '</div>' : '');
      };

      // Esperando asignación, agrupado por proveedor y edición.
      const pend = {};
      porAsignar.forEach((p) => {
        const k = p.proveedor + '|' + p.edicion;
        const x = pend[k] || (pend[k] = { proveedor: p.proveedor, edicion: p.edicion, productos: 0, unidades: 0 });
        x.productos++;
        x.unidades += p.solicitado;
      });

      el.innerHTML =
        '<div class="page-head"><div><h1>Dashboard</h1><p>Resumen de la operación de GS Prime.</p></div></div>' +
        dinero() +
        '<div class="dash-titulo"><h3>Preventas</h3></div>' +
        '<div class="kpi-grid">' +
        kpi('Productos en preventa', activas.length, porAsignar.length ? '<span class="text-gold">' + porAsignar.length + ' esperando asignación</span>' : 'Todos asignados') +
        kpi('Unidades por comprar', fmt.num(asignadas.reduce((s, p) => s + p.asignado, 0)), 'Asignadas, aún sin compra') +
        kpi('Compromiso con proveedores', fmt.money(iva(compromiso)), 'Con IVA · ' + fmt.money(compromiso) + ' neto') +
        kpi('Ganancia proyectada', '<span class="text-success">' + fmt.money(ganancia) + '</span>', 'Real neta de las preventas activas') +
        '</div>' +
        '<div class="dash-grid">' +
        '<div class="panel"><div class="panel-head"><h3>Próximos lanzamientos</h3><span class="tag">Un pedido por proveedor y fecha</span></div><div class="panel-body">' +
        (lista.length
          ? '<table class="mini-table"><thead><tr><th>Fecha</th><th>Pedido</th><th class="right">Productos</th><th class="right">Neto</th><th>Despacho</th></tr></thead><tbody>' +
            lista.slice(0, 8).map((x) => '<tr><td class="nowrap">' + fmt.date(x.fecha) + '<div>' + GS.relDays(x.fecha) + '</div></td>' +
              '<td class="prod-cell"><div class="name">' + esc(x.proveedor) + '</div><div class="prov">' + esc(Array.from(x.ediciones).join(', ') || '—') + '</div></td>' +
              '<td class="cell-num right">' + x.productos + '</td><td class="cell-num right">' + fmt.money(x.neto) + '</td><td>' + despacho(x) + '</td></tr>').join('') +
            '</tbody></table>'
          : GS.empty('Sin lanzamientos próximos', 'Agrega productos en Preventas a medida que el proveedor los anuncia.', 'preventas')) +
        '</div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Esperando asignación</h3></div><div class="panel-body">' +
        (Object.keys(pend).length
          ? '<table class="mini-table"><thead><tr><th>Proveedor · edición</th><th class="right">Productos</th><th class="right">Solicitado</th></tr></thead><tbody>' +
            Object.values(pend).map((x) => '<tr><td class="prod-cell"><div class="name">' + esc(x.proveedor) + '</div><div class="prov">' + esc(x.edicion || 'Sin edición') + '</div></td>' +
              '<td class="cell-num right">' + x.productos + '</td><td class="cell-num right">' + fmt.num(x.unidades) + '</td></tr>').join('') +
            '</tbody></table>'
          : GS.empty('Nada pendiente', 'Todas las preventas tienen su asignación registrada.')) +
        '</div></div>' +
        '</div>';
    },
  };
})();
</script>
