<script>
/* =========================================================
   Dashboard: próximos lanzamientos, asignaciones pendientes
   y compromiso con proveedores.
========================================================= */
(function () {
  'use strict';
  const { fmt, esc } = GS;

  function kpi(label, value, sub, cls) {
    return '<div class="kpi-card ' + (cls || '') + '"><div class="kpi-label">' + label + '</div>' +
      '<div class="kpi-value">' + value + '</div><div class="kpi-sub">' + (sub || '') + '</div></div>';
  }

  GS.views.dashboard = {
    title: 'Dashboard',
    render(el, d) {
      const iva = (n) => n * (1 + d.app.iva);
      const lineas = [];
      d.preventas.forEach((pv) => pv.lineas.forEach((l) => lineas.push(Object.assign({ pv: pv }, l))));
      const abiertas = lineas.filter((l) => ['solicitada', 'asignada'].indexOf(l.estado) !== -1);
      const porAsignar = lineas.filter((l) => l.estado === 'solicitada');
      const asignadas = lineas.filter((l) => l.estado === 'asignada');
      const pvsPendientes = d.preventas.filter((p) => p.lineasPendientes > 0);
      const compromiso = asignadas.reduce((s, l) => s + l.netoAsignado, 0);
      const ganancia = abiertas.reduce((s, l) => s + l.gananciaTotal, 0);

      // Próximos pedidos: un pedido por preventa y fecha de lanzamiento.
      const pedidos = [];
      d.preventas.forEach((pv) => pv.lanzamientos.forEach((x) => {
        if (x.fecha >= d.hoy) pedidos.push(Object.assign({ pv: pv }, x));
      }));
      pedidos.sort((a, b) => (a.fecha < b.fecha ? -1 : 1));

      el.innerHTML =
        '<div class="page-head"><div><h1>Dashboard</h1><p>Resumen de la operación de GS Prime.</p></div></div>' +
        '<div class="kpi-grid">' +
        kpi('Preventas en curso', d.preventas.filter((p) => p.lineas.some((l) => ['solicitada', 'asignada'].indexOf(l.estado) !== -1)).length,
          pvsPendientes.length ? '<span class="text-gold">' + pvsPendientes.length + ' esperando asignación</span>' : 'Todas asignadas') +
        kpi('Unidades por comprar', fmt.num(asignadas.reduce((s, l) => s + l.asignado, 0)), 'Asignadas, aún sin compra') +
        kpi('Compromiso con proveedores', fmt.money(iva(compromiso)), 'Con IVA · ' + fmt.money(compromiso) + ' neto') +
        kpi('Ganancia proyectada', '<span class="text-success">' + fmt.money(ganancia) + '</span>', 'Real neta de preventas en curso') +
        '</div>' +
        '<div class="dash-grid">' +
        '<div class="panel"><div class="panel-head"><h3>Próximos lanzamientos</h3><span class="tag">Un pedido por fecha</span></div><div class="panel-body">' +
        (pedidos.length
          ? '<table class="mini-table"><thead><tr><th>Fecha</th><th>Edición</th><th class="right">Productos</th><th class="right">Neto</th><th>Despacho</th></tr></thead><tbody>' +
            pedidos.slice(0, 8).map((x) => '<tr><td class="nowrap">' + fmt.date(x.fecha) + '<div>' + GS.relDays(x.fecha) + '</div></td>' +
              '<td class="prod-cell"><div class="name"><a class="link" data-nav="preventa" data-param="' + esc(x.pv.id) + '">' + esc(x.pv.edicion) + '</a></div><div class="prov">' + esc(x.pv.id) + ' · ' + esc(x.pv.proveedor) + '</div></td>' +
              '<td class="cell-num right">' + x.productos + '</td><td class="cell-num right">' + fmt.money(x.neto) + '</td>' +
              '<td>' + (x.despacho ? '<span class="text-gold">' + fmt.money(x.despacho) + '</span>' + (x.faltaParaGratis > 0 ? '<div class="cell-dim">faltan ' + fmt.money(x.faltaParaGratis) + '</div>' : '') : '<span class="text-success">Gratis</span>') + '</td></tr>').join('') +
            '</tbody></table>'
          : GS.empty('Sin lanzamientos próximos', 'Crea una preventa cuando el proveedor anuncie una nueva edición.', 'preventas')) +
        '</div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Esperando asignación</h3></div><div class="panel-body">' +
        (pvsPendientes.length
          ? '<table class="mini-table"><thead><tr><th>Preventa</th><th class="right">Productos</th><th class="right">Solicitado</th></tr></thead><tbody>' +
            pvsPendientes.map((p) => '<tr><td class="prod-cell"><div class="name"><a class="link" data-nav="preventa" data-param="' + esc(p.id) + '">' + esc(p.edicion) + '</a></div><div class="prov">' + esc(p.id) + ' · ' + esc(p.proveedor) + '</div></td>' +
              '<td class="cell-num right">' + p.lineasPendientes + '</td>' +
              '<td class="cell-num right">' + fmt.num(porAsignar.filter((l) => l.preventaId === p.id).reduce((s, l) => s + l.solicitado, 0)) + '</td></tr>').join('') +
            '</tbody></table>'
          : GS.empty('Nada pendiente', 'Todas las preventas tienen su asignación registrada.')) +
        '</div></div>' +
        '</div>';
    },
  };
})();
</script>
