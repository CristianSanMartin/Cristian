<script>
/* =========================================================
   GS PRIME ERP — núcleo del cliente
   API, formato, permisos, modales, formularios y navegación.
   Cada módulo (js-*.html) registra su vista en GS.views y sus
   acciones de botones en GS.actions.
========================================================= */
(function () {
  'use strict';

  const GS = (window.GS = {
    state: { data: null, view: 'dashboard', filters: {} },
    views: {},
    actions: {},
  });

  /* ---------- API ---------- */

  /** Llama a api(accion, datos) en el servidor. Rechaza con el mensaje de negocio si la respuesta no es ok. */
  GS.api = function (accion, datos) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => {
          if (!res) return reject(new Error('El servidor no respondió. Recarga la página.'));
          if (!res.ok) {
            const err = new Error(res.error);
            err.code = res.code;
            return reject(err);
          }
          resolve(res);
        })
        .withFailureHandler((err) => reject(new Error(err && err.message ? err.message : String(err))))
        .api(accion, datos || {});
    });
  };

  /** Escritura: aplica la foto de datos que devuelve el servidor y vuelve a dibujar. */
  GS.mutate = async function (accion, datos, mensaje) {
    const res = await GS.api(accion, datos);
    GS.state.data = res.data;
    GS.render();
    if (mensaje) GS.toast(typeof mensaje === 'function' ? mensaje(res.result) : mensaje);
    return res.result;
  };

  GS.refresh = async function () {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('loading');
    try {
      const res = await GS.api('bootstrap');
      GS.state.data = res.data;
      GS.render();
    } catch (e) {
      GS.toast(e.message, true);
    } finally {
      btn.classList.remove('loading');
    }
  };

  /* ---------- formato ---------- */

  const nf = new Intl.NumberFormat('es-CL');
  const nf2 = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 2 });
  GS.fmt = {
    money: (n) => (Number(n) < 0 ? '-$' : '$') + nf.format(Math.round(Math.abs(Number(n) || 0))),
    /** Costos del proveedor: conservan los centavos si los hay ($15.876,5). */
    cost: (n) => (Number(n) < 0 ? '-$' : '$') + nf2.format(Math.abs(Number(n) || 0)),
    num: (n) => nf.format(Number(n) || 0),
    date: (iso) => {
      if (!iso) return '—';
      const [y, m, d] = String(iso).slice(0, 10).split('-');
      return d + '-' + m + '-' + y;
    },
    pct: (n) => (Number.isFinite(n) ? Math.round(n * 100) + '%' : '—'),
    signed: (n) => (n > 0 ? '+' : '') + nf.format(n),
  };

  /** Días entre hoy (según el servidor) y la fecha ISO. */
  GS.daysUntil = function (iso) {
    const hoy = new Date(GS.state.data.hoy + 'T00:00:00Z');
    return Math.round((new Date(iso + 'T00:00:00Z') - hoy) / 86400000);
  };

  GS.relDays = function (iso) {
    const d = GS.daysUntil(iso);
    if (d === 0) return '<span class="pill soon">hoy</span>';
    if (d < 0) return '<span class="pill late">hace ' + -d + ' d</span>';
    return '<span class="pill' + (d <= 7 ? ' soon' : '') + '">en ' + d + ' d</span>';
  };

  GS.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  };

  GS.norm = function (s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  };

  GS.options = function (list, selected, labels) {
    return list.map((v) => {
      const value = typeof v === 'object' ? v.value : v;
      const label = typeof v === 'object' ? v.label : labels ? labels[v] : v;
      return '<option value="' + GS.esc(value) + '"' + (String(value) === String(selected) ? ' selected' : '') + '>' + GS.esc(label) + '</option>';
    }).join('');
  };

  /* ---------- permisos ---------- */

  const ROLES = { lectura: 1, operador: 2, admin: 3 };
  GS.puede = (rol) => (ROLES[GS.state.data.user.rol] || 0) >= ROLES[rol];

  /* ---------- catálogos de UI ---------- */

  GS.ESTADOS_LINEA = {
    solicitada: { label: 'Solicitada', cls: 'st-pedido', color: '#8a8a90' },
    asignada: { label: 'Asignada', cls: 'st-parcial', color: '#f6b400' },
    sin_asignacion: { label: 'Sin asignación', cls: 'st-cancelada', color: '#e0524b' },
    en_compra: { label: 'En compra', cls: 'st-transito', color: '#c98a00' },
    recibida: { label: 'Recibida', cls: 'st-recibida', color: '#3fae6c' },
  };
  GS.ESTADOS_PV = {
    borrador: { label: 'Sin productos', cls: 'st-pedido' },
    solicitada: { label: 'Esperando asignación', cls: 'st-pedido' },
    asignada: { label: 'Asignada', cls: 'st-parcial' },
  };
  /** Distintivo de idioma: azul para inglés, verde para español. */
  GS.langPill = (idioma) => '<span class="pill lang lang-' + GS.esc(idioma || 'Otro') + '">' + GS.esc(idioma || '—') + '</span>';

  GS.badge = (map, key) => {
    const e = map[key] || { label: key, cls: '' };
    return '<span class="badge ' + e.cls + '">' + GS.esc(e.label) + '</span>';
  };

  /* ---------- íconos ---------- */

  const ICONS = {
    dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
    preventas: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M8 14l2.5 2.5L16 11"/>',
    compras: '<path d="M3 6h2l2.4 12.2a2 2 0 0 0 2 1.8h8.6a2 2 0 0 0 2-1.6L22 9H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',
    ventas: '<path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    inventario: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
    admin: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/><path d="M19 3l2 2-2 2"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    close: '<path d="M18 6L6 18"/><path d="M6 6l12 12"/>',
    money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4"/><path d="M18 10v4"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    move: '<path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M21 16l-4 4-4-4"/>',
    list: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
    archive: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
    download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    box: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/>',
    productos: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    proveedores: '<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
    finanzas: '<path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/>',
    back: '<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>',
  };
  GS.icon = (name, w) =>
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';

  GS.iconBtn = (action, id, icon, title, cls) =>
    '<button class="icon-btn ' + (cls || '') + '" title="' + GS.esc(title) + '" aria-label="' + GS.esc(title) + '" data-action="' + action + '" data-id="' + GS.esc(id) + '">' + GS.icon(icon) + '</button>';

  GS.empty = (title, sub, icon) =>
    '<div class="empty-state">' + GS.icon(icon || 'box', 1.6) + '<div class="e-title">' + GS.esc(title) + '</div>' + (sub ? '<div class="e-sub">' + GS.esc(sub) + '</div>' : '') + '</div>';

  /* ---------- toast ---------- */

  GS.toast = function (msg, isDanger) {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    t.classList.toggle('danger', !!isDanger);
    t.classList.add('show');
    clearTimeout(GS.toast._tm);
    GS.toast._tm = setTimeout(() => t.classList.remove('show'), isDanger ? 5000 : 2600);
  };

  /* ---------- modales ---------- */

  const openModals = [];

  /**
   * Abre un modal. `body` es una función que devuelve HTML; si `live` es true
   * se vuelve a ejecutar cada vez que cambian los datos (p. ej. tras registrar
   * un abono). `onRender(el, modal)` corre después de cada dibujo.
   */
  GS.modal = function (opts) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3></h3><button class="modal-close" data-close aria-label="Cerrar">' + GS.icon('close') + '</button></div>' +
      '<div class="modal-content"></div></div>';
    overlay.querySelector('h3').textContent = opts.title;
    document.getElementById('modal-root').appendChild(overlay);

    const modal = {
      el: overlay,
      opts: opts,
      render() {
        overlay.querySelector('.modal-content').innerHTML = opts.body();
        if (opts.onRender) opts.onRender(overlay, modal);
      },
      close() {
        const i = openModals.indexOf(modal);
        if (i !== -1) openModals.splice(i, 1);
        overlay.remove();
        if (opts.onClose) opts.onClose();
      },
    };
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) modal.close(); });
    overlay.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) modal.close(); });
    openModals.push(modal);
    modal.render();
    const first = overlay.querySelector('input:not([type=hidden]):not(:disabled), select, textarea');
    if (first && !opts.noAutofocus) setTimeout(() => first.focus(), 30);
    return modal;
  };

  GS.closeModals = () => openModals.slice().forEach((m) => m.close());

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && openModals.length) openModals[openModals.length - 1].close();
  });

  /** Lee un formulario como objeto plano; los checkbox se leen como booleanos. */
  GS.formValues = function (form) {
    const out = {};
    Array.from(form.elements).forEach((el) => {
      if (!el.name || el.disabled) return;
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else out[el.name] = el.value.trim();
    });
    return out;
  };

  /**
   * Conecta el envío de un formulario: bloquea el botón mientras espera, muestra
   * el error del servidor dentro del formulario y no pierde lo escrito.
   */
  GS.bindForm = function (form, handler) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = form.querySelector('.form-error');
      const submit = form.querySelector('[type=submit]');
      if (errBox) errBox.classList.remove('show');
      if (submit) { submit.disabled = true; submit.dataset.label = submit.textContent; submit.textContent = 'Guardando…'; }
      try {
        await handler(GS.formValues(form), form);
      } catch (err) {
        if (errBox) { errBox.textContent = err.message; errBox.classList.add('show'); errBox.scrollIntoView({ block: 'nearest' }); }
        else GS.toast(err.message, true);
      } finally {
        if (submit && submit.isConnected) { submit.disabled = false; submit.textContent = submit.dataset.label; }
      }
    });
  };

  /** Modal con formulario: se cierra solo si onSubmit termina sin error. */
  GS.formModal = function (opts) {
    let modal;
    modal = GS.modal({
      title: opts.title,
      size: opts.size,
      body: () =>
        '<form novalidate>' +
        '<div class="modal-body">' + opts.fields() + '<div class="form-error"></div></div>' +
        '<div class="modal-foot">' +
        '<button type="button" class="btn secondary" data-close>Cancelar</button>' +
        '<button type="submit" class="btn ' + (opts.danger ? 'danger' : '') + '">' + GS.esc(opts.submitLabel || 'Guardar') + '</button>' +
        '</div></form>',
      onRender: (el) => {
        const form = el.querySelector('form');
        GS.bindForm(form, async (values) => {
          await opts.onSubmit(values, form, modal);
          modal.close();
        });
        if (opts.onMount) opts.onMount(form, modal);
      },
      onClose: opts.onClose,
    });
    return modal;
  };

  /** Confirmación simple o con motivo obligatorio. Resuelve la acción dentro del modal para mostrar errores. */
  GS.confirm = function (opts) {
    return GS.formModal({
      title: opts.title,
      submitLabel: opts.confirmLabel || 'Confirmar',
      danger: opts.danger,
      fields: () =>
        '<p class="confirm-text" style="padding:0 0 12px;">' + opts.message + '</p>' +
        (opts.input
          ? '<div class="form-field"><label>' + GS.esc(opts.input.label) + '</label><textarea name="' + opts.input.name + '" rows="2" placeholder="' + GS.esc(opts.input.placeholder || '') + '"></textarea></div>'
          : ''),
      onSubmit: (values) => opts.onConfirm(values),
    });
  };

  /* ---------- exportar ---------- */

  GS.downloadCsv = function (filename, headers, rows) {
    const cell = (v) => {
      const s = String(v == null ? '' : v);
      return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = '﻿' + [headers].concat(rows).map((r) => r.map(cell).join(';')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };

  /* ---------- navegación ---------- */

  const NAV = [
    { group: 'Operación' },
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'preventas', label: 'Preventas' },
    { id: 'compras', label: 'Compras', soon: true },
    { id: 'inventario', label: 'Inventario', soon: true },
    { id: 'ventas', label: 'Ventas', soon: true },
    { id: 'finanzas', label: 'Finanzas', soon: true },
    { group: 'Catálogos' },
    { id: 'productos', label: 'Productos' },
    { id: 'proveedores', label: 'Proveedores' },
    { group: 'Sistema', rol: 'admin' },
    { id: 'admin', label: 'Administración', rol: 'admin' },
  ];

  function renderNav() {
    let html = '';
    let open = false;
    NAV.forEach((n) => {
      if (n.rol && !GS.puede(n.rol)) return;
      if (n.group) {
        if (open) html += '</ul>';
        html += '<div class="nav-group-label">' + n.group + '</div><ul class="nav">';
        open = true;
        return;
      }
      const actual = GS.views[GS.state.view] || {};
      const activo = GS.state.view === n.id || actual.parent === n.id;
      html += '<li class="nav-item' + (activo ? ' active' : '') + '" data-nav="' + n.id + '">' +
        GS.icon(n.id === 'admin' ? 'admin' : n.id) + '<span>' + n.label + '</span>' + (n.soon ? '<span class="soon-tag">Pronto</span>' : '') + '</li>';
    });
    if (open) html += '</ul>';
    document.getElementById('nav').innerHTML = html;
  }

  /** Navega a una vista; `param` identifica el registro en vistas de detalle (ej. una preventa). */
  GS.go = function (view, param) {
    if (!GS.views[view]) return;
    GS.state.view = view;
    GS.state.param = param || null;
    document.getElementById('sidebar').classList.remove('open');
    GS.render();
    window.scrollTo(0, 0);
  };

  GS.render = function () {
    const data = GS.state.data;
    if (!data) return;
    const u = data.user;
    document.getElementById('user-avatar').textContent = (u.nombre || u.email).slice(0, 2).toUpperCase();
    document.getElementById('user-name').textContent = u.nombre || u.email;
    document.getElementById('user-role').textContent = { admin: 'Administrador', operador: 'Operador', lectura: 'Solo lectura' }[u.rol] || u.rol;
    document.getElementById('footer-user').textContent = u.email;
    document.getElementById('footer-version').textContent = data.app.version;

    let view = GS.views[GS.state.view];
    if (!view || (view.rol && !GS.puede(view.rol))) { GS.state.view = 'dashboard'; view = GS.views.dashboard; }
    renderNav();
    document.getElementById('topbar-title').textContent = view.title;
    view.render(document.getElementById('view'), data, GS.state.param);
    openModals.forEach((m) => { if (m.opts.live) m.render(); });
  };

  /* Clicks: navegación y botones con data-action (delegados en todo el documento). */
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) return GS.go(nav.dataset.nav, nav.dataset.param);
    const btn = e.target.closest('[data-action]');
    if (btn && !btn.disabled && GS.actions[btn.dataset.action]) {
      e.preventDefault();
      GS.actions[btn.dataset.action](btn.dataset.id, btn);
    }
  });

  /* Filtros: cualquier control con data-filter="vista.campo" guarda su valor y redibuja la vista. */
  function onFilter(e) {
    const el = e.target.closest('[data-filter]');
    if (!el) return;
    const [view, key] = el.dataset.filter.split('.');
    const f = (GS.state.filters[view] = GS.state.filters[view] || {});
    f[key] = el.type === 'checkbox' ? el.checked : el.value;
    const v = GS.views[view];
    if (v && v.update) v.update(); else GS.render();
  }
  document.addEventListener('input', onFilter);

  GS.filters = function (view, defaults) {
    GS.state.filters[view] = Object.assign({}, defaults, GS.state.filters[view]);
    return GS.state.filters[view];
  };

  /* ---------- tablas con orden y filtro por columna (estilo Excel) ----------
     Cada tabla declara columnas { id, label, valor(fila) para ordenar, texto(fila)
     para filtrar, right?, sinMenu? }. El estado (orden y valores visibles por
     columna) vive en GS.state.tablas[tabla] y sobrevive a los redibujos. */

  GS.state.tablas = {};
  const tablas = {};   // tabla -> { filas: () => [...], columnas: [...], alCambiar: fn }

  GS.tabla = function (id, defaults) {
    if (!GS.state.tablas[id]) GS.state.tablas[id] = Object.assign({ orden: null, filtros: {} }, defaults || {});
    return GS.state.tablas[id];
  };

  GS.tablaRegistrar = function (id, def) { tablas[id] = def; };

  const textoDe = (col, fila) => String(col.texto ? col.texto(fila) : col.valor(fila));

  /** Aplica filtros por columna y el orden elegido. */
  GS.tablaAplicar = function (id, filas, columnas) {
    const st = GS.tabla(id);
    let res = filas.filter((f) => columnas.every((c) => {
      const permitidos = st.filtros[c.id];
      return !permitidos || permitidos.indexOf(textoDe(c, f)) !== -1;
    }));
    const col = st.orden && columnas.find((c) => c.id === st.orden.col);
    if (col) {
      const dir = st.orden.dir === 'desc' ? -1 : 1;
      res = res.slice().sort((a, b) => {
        const x = col.valor(a);
        const y = col.valor(b);
        if (x == null || x === '') return 1;
        if (y == null || y === '') return -1;
        return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true })) * dir;
      });
    }
    return res;
  };

  /** Encabezados con botón de orden/filtro. */
  GS.tablaEncabezado = function (id, columnas) {
    const st = GS.tabla(id);
    return columnas.map((c) => {
      if (c.sinMenu) return '<th' + (c.right ? ' class="right"' : '') + '>' + GS.esc(c.label || '') + '</th>';
      const activo = !!st.filtros[c.id];
      const orden = st.orden && st.orden.col === c.id ? st.orden.dir : '';
      return '<th class="' + (c.right ? 'right ' : '') + (c.clase || '') + '"><span class="th-wrap">' + GS.esc(c.label) +
        '<button type="button" class="th-menu' + (activo ? ' activo' : '') + (orden ? ' ordenado' : '') + '" data-action="menuColumna" data-id="' + GS.esc(id + '|' + c.id) + '" ' +
        'aria-label="Ordenar y filtrar ' + GS.esc(c.label) + '" title="Ordenar y filtrar">' +
        (orden === 'asc' ? '▲' : orden === 'desc' ? '▼' : activo ? '⧩' : '▾') + '</button></span></th>';
    }).join('');
  };

  let menuAbierto = null;
  const cerrarMenu = () => { if (menuAbierto) { menuAbierto.remove(); menuAbierto = null; } };
  document.addEventListener('mousedown', (e) => { if (menuAbierto && !menuAbierto.contains(e.target) && !e.target.closest('.th-menu')) cerrarMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarMenu(); });

  GS.actions.menuColumna = (ref, btn) => {
    const [id, colId] = ref.split('|');
    const def = tablas[id];
    if (!def) return;
    if (menuAbierto && menuAbierto.dataset.ref === ref) return cerrarMenu();
    cerrarMenu();
    const col = def.columnas.find((c) => c.id === colId);
    const st = GS.tabla(id);
    // Valores posibles: los de las filas que pasan los filtros de las OTRAS columnas (como Excel).
    const otras = def.columnas.filter((c) => c.id !== colId);
    const base = def.filas().filter((f) => otras.every((c) => !st.filtros[c.id] || st.filtros[c.id].indexOf(textoDe(c, f)) !== -1));
    const valores = Array.from(new Set(base.map((f) => textoDe(col, f))))
      .sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
    const permitidos = st.filtros[colId];

    const m = document.createElement('div');
    m.className = 'col-menu';
    m.dataset.ref = ref;
    m.innerHTML =
      '<button type="button" data-orden="asc">▲ Ordenar ascendente</button>' +
      '<button type="button" data-orden="desc">▼ Ordenar descendente</button>' +
      (st.orden && st.orden.col === colId ? '<button type="button" data-orden="">Quitar orden</button>' : '') +
      '<div class="col-menu-sep"></div>' +
      '<input type="text" class="col-menu-buscar" placeholder="Buscar…" aria-label="Buscar valores">' +
      '<label class="col-menu-item todos"><input type="checkbox" data-todos> (Seleccionar todo)</label>' +
      '<div class="col-menu-lista">' + valores.map((v) =>
        '<label class="col-menu-item"><input type="checkbox" value="' + GS.esc(v) + '"' + (!permitidos || permitidos.indexOf(v) !== -1 ? ' checked' : '') + '> ' +
        GS.esc(v === '' ? '(vacío)' : v) + '</label>').join('') + '</div>' +
      '<div class="col-menu-pie"><button type="button" class="btn ghost small" data-limpiar>Limpiar filtro</button><button type="button" class="btn small" data-aplicar>Aplicar</button></div>';
    document.body.appendChild(m);
    const r = btn.getBoundingClientRect();
    m.style.top = (window.scrollY + r.bottom + 6) + 'px';
    m.style.left = Math.max(8, Math.min(window.scrollX + r.left - 10, window.scrollX + document.documentElement.clientWidth - m.offsetWidth - 8)) + 'px';
    menuAbierto = m;

    const checks = () => Array.from(m.querySelectorAll('.col-menu-lista input'));
    const visibles = () => checks().filter((c) => c.closest('label').style.display !== 'none');
    const syncTodos = () => { m.querySelector('[data-todos]').checked = visibles().every((c) => c.checked); };
    syncTodos();
    m.querySelector('.col-menu-buscar').addEventListener('input', (e) => {
      const q = GS.norm(e.target.value);
      checks().forEach((c) => { c.closest('label').style.display = GS.norm(c.value).includes(q) ? '' : 'none'; });
      syncTodos();
    });
    m.querySelector('[data-todos]').addEventListener('change', (e) => visibles().forEach((c) => { c.checked = e.target.checked; }));
    m.querySelector('.col-menu-lista').addEventListener('change', syncTodos);
    const listo = () => { cerrarMenu(); def.alCambiar(); };
    m.querySelectorAll('[data-orden]').forEach((b) => b.addEventListener('click', () => {
      st.orden = b.dataset.orden ? { col: colId, dir: b.dataset.orden } : null;
      listo();
    }));
    m.querySelector('[data-limpiar]').addEventListener('click', () => { delete st.filtros[colId]; listo(); });
    m.querySelector('[data-aplicar]').addEventListener('click', () => {
      const marcados = checks().filter((c) => c.checked).map((c) => c.value);
      // Todo marcado = sin filtro en esta columna.
      if (marcados.length === valores.length) delete st.filtros[colId];
      else st.filtros[colId] = marcados;
      listo();
    });
    m.querySelector('.col-menu-buscar').focus();
  };

  GS.actions.tab = (id, el) => {
    const [view, tab] = id.split('.');
    GS.filters(view).tab = tab;
    GS.render();
  };

  /* ---------- arranque ---------- */

  GS.start = async function () {
    document.getElementById('menu-toggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
    document.getElementById('btn-refresh').addEventListener('click', GS.refresh);
    try {
      const res = await GS.api('bootstrap');
      GS.state.data = res.data;
      document.getElementById('boot').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      GS.render();
    } catch (err) {
      const denied = err.code === 'NO_AUTORIZADO';
      const notInstalled = err.code === 'NO_INSTALADO';
      document.getElementById('boot-body').innerHTML =
        '<h2>' + (denied ? 'Acceso restringido' : notInstalled ? 'ERP sin instalar' : 'No se pudo cargar') + '</h2>' +
        '<p>' + GS.esc(err.message) + '</p>' +
        '<button class="btn" onclick="location.reload()">Reintentar</button>';
    }
  };
})();
</script>
