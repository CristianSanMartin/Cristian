<script>
/* =========================================================
   Preventas por edición: listado, detalle con líneas por
   fecha de lanzamiento, y registro de la asignación.
========================================================= */
(function () {
  'use strict';
  const { fmt, esc } = GS;
  const data = () => GS.state.data;
  const findPv = (id) => data().preventas.find((p) => p.id === id);
  const iva = (n) => n * (1 + data().app.iva);
  const EDITABLES = ['solicitada', 'asignada', 'sin_asignacion'];
  const editable = (l) => EDITABLES.indexOf(l.estado) !== -1;

  /* ---------- listado ---------- */

  const DEF = { q: '', proveedor: '', estado: '' };

  function filtradas() {
    const f = GS.filters('preventas', DEF);
    const q = GS.norm(f.q.trim());
    return data().preventas
      .filter((p) => {
        if (f.proveedor && p.proveedorId !== f.proveedor) return false;
        if (f.estado && p.estado !== f.estado) return false;
        return !q || GS.norm(p.id + ' ' + p.edicion + ' ' + p.proveedor + ' ' + p.lineas.map((l) => l.producto).join(' ')).includes(q);
      })
      .sort((a, b) => (a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0));
  }

  GS.views.preventas = {
    title: 'Preventas',
    render(el, d) {
      const f = GS.filters('preventas', DEF);
      el.innerHTML =
        '<div class="page-head"><div><h1>Preventas</h1><p>Solicitudes por edición al proveedor y lo que finalmente asignó.</p></div>' +
        (GS.puede('operador') ? '<button class="btn' + (nuevaAbierta ? ' secondary' : '') + '" data-action="nuevaPreventa" aria-expanded="' + nuevaAbierta + '" aria-controls="nueva-preventa">' +
          GS.icon(nuevaAbierta ? 'close' : 'plus', 2.4) + (nuevaAbierta ? 'Cerrar' : 'Nueva preventa') + '</button>' : '') + '</div>' +
        panelNuevaPreventa() +
        '<div class="filters-bar">' +
        '<div class="search-box">' + GS.icon('search') + '<input type="text" data-filter="preventas.q" value="' + esc(f.q) + '" placeholder="Buscar por edición, producto o folio..."></div>' +
        '<div class="select-input"><select data-filter="preventas.proveedor">' + GS.options([{ value: '', label: 'Todos los proveedores' }].concat(d.proveedores.map((p) => ({ value: p.id, label: p.nombre }))), f.proveedor) + '</select></div>' +
        '<div class="select-input"><select data-filter="preventas.estado">' + GS.options([{ value: '', label: 'Todos los estados' }].concat(Object.keys(GS.ESTADOS_PV).map((k) => ({ value: k, label: GS.ESTADOS_PV[k].label }))), f.estado) + '</select></div>' +
        '<span class="count" id="pv-count"></span></div>' +
        '<div class="table-wrap"><table class="data-table wide"><thead><tr>' +
        '<th>Folio</th><th class="col-prod">Edición</th><th>Proveedor</th><th>Solicitud</th><th>Lanzamientos</th><th class="right">Productos</th>' +
        '<th class="right">Solicitado</th><th class="right">Asignado</th><th class="right">Total neto</th><th class="right">Total + IVA</th><th class="right">Ganancia proyectada</th><th>Estado</th>' +
        '</tr></thead><tbody id="pv-tbody"></tbody></table></div>' +
        '<p class="table-note">Totales según lo asignado (o lo solicitado, en líneas aún sin asignar). Ganancia real neta, sin despacho.</p>';
      conectarNuevaPreventa(el);
      this.update();
    },
    update() {
      const rows = filtradas();
      document.getElementById('pv-count').textContent = rows.length + ' de ' + data().preventas.length;
      document.getElementById('pv-tbody').innerHTML = rows.length
        ? rows.map((p) => '<tr>' +
          '<td class="nowrap"><a class="link" data-nav="preventa" data-param="' + esc(p.id) + '">' + esc(p.id) + '</a></td>' +
          '<td class="cell-strong"><a class="link" data-nav="preventa" data-param="' + esc(p.id) + '">' + esc(p.edicion) + '</a></td>' +
          '<td>' + esc(p.proveedor) + '</td><td class="nowrap">' + fmt.date(p.fecha) + '</td>' +
          '<td>' + (p.lanzamientos.map((x) => '<span class="pill">' + fmt.date(x.fecha).slice(0, 5) + '</span>').join(' ') || '—') + '</td>' +
          '<td class="cell-num right">' + p.lineas.length + '</td>' +
          '<td class="cell-num right">' + fmt.num(p.unidadesSolicitadas) + '</td>' +
          '<td class="cell-num right">' + (p.estado === 'asignada' || p.unidadesAsignadas ? fmt.num(p.unidadesAsignadas) : '—') + '</td>' +
          '<td class="cell-num right">' + fmt.money(p.netoVigente) + '</td>' +
          '<td class="cell-num right cell-strong">' + fmt.money(iva(p.netoVigente)) + '</td>' +
          '<td class="cell-num right text-success">' + fmt.money(p.gananciaProyectada) + '</td>' +
          '<td>' + GS.badge(GS.ESTADOS_PV, p.estado) + '</td></tr>').join('')
        : '<tr><td colspan="12">' + GS.empty('No hay preventas', 'Crea una preventa cuando el proveedor anuncie una nueva edición.', 'preventas') + '</td></tr>';
    },
  };

  /* ---------- detalle ---------- */

  function despachoAviso(x, prov) {
    if (!prov || !prov.despachoMonto) return '';
    if (!x.despacho) return '<span class="text-success">✓ Despacho gratis</span>';
    return '<span class="text-gold">Despacho ' + fmt.money(x.despacho) + '</span>' +
      (x.faltaParaGratis > 0 ? ' · faltan <strong>' + fmt.money(x.faltaParaGratis) + '</strong> para despacho gratis' : '');
  }

  function filaLinea(l, operador) {
    const asignada = l.estado !== 'solicitada';
    const vigente = (v) => (asignada ? v : '<span class="muted">—</span>');
    return '<tr class="' + (l.estado === 'sin_asignacion' ? 'row-muted' : '') + '">' +
      '<td>' + GS.thumb(l.imagen) + '</td>' +
      '<td class="cell-strong">' + esc(l.productoNombre) + ' <span class="pill lang">' + esc(l.idioma) + '</span><div class="cell-dim">' + esc(l.id) + ' · ' + esc(l.tipo) + '</div></td>' +
      '<td>' + GS.badge(GS.ESTADOS_LINEA, l.estado) + '</td>' +
      '<td class="cell-num right">' + fmt.num(l.solicitado) + '</td>' +
      '<td class="cell-num right cell-strong">' + vigente(fmt.num(l.asignado)) + '</td>' +
      '<td class="cell-num right ' + (l.diferencia < 0 ? 'text-gold' : '') + '">' + vigente(fmt.num(l.diferencia)) + '</td>' +
      '<td class="cell-num right">' + fmt.cost(l.costoNeto) + '</td>' +
      '<td class="cell-num right">' + fmt.money(l.costoIva) + '</td>' +
      '<td class="cell-num right">' + fmt.money(l.netoSolicitado) + '</td>' +
      '<td class="cell-num right">' + fmt.money(iva(l.netoSolicitado)) + '</td>' +
      '<td class="cell-num right cell-strong">' + vigente(fmt.money(l.netoAsignado)) + '</td>' +
      '<td class="cell-num right cell-strong">' + vigente(fmt.money(iva(l.netoAsignado))) + '</td>' +
      '<td class="cell-num right">' + (l.pvp ? fmt.money(l.pvp) : '—') + '</td>' +
      '<td class="cell-num right">' + (l.precioVenta ? fmt.money(l.precioVenta) : '—') + (l.precioManual ? '<div><span class="pill soon">manual</span></div>' : '') + '</td>' +
      '<td class="cell-num right">' + (l.precioVenta ? fmt.pct(l.recargo) : '—') + '</td>' +
      '<td class="cell-num right ' + (l.gananciaUnidad < 0 ? 'text-danger' : 'text-success') + '">' + (l.precioVenta ? fmt.money(l.gananciaUnidad) : '—') + '</td>' +
      '<td class="cell-num right ' + (l.gananciaTotal < 0 ? 'text-danger' : 'text-success') + '">' + (l.precioVenta ? fmt.money(l.gananciaTotal) : '—') + '</td>' +
      '<td><div class="row-actions">' + (operador && editable(l)
        ? GS.iconBtn('editarLinea', l.id, 'edit', 'Editar') + GS.iconBtn('eliminarLinea', l.id, 'trash', 'Quitar de la preventa', 'danger') : '') + '</div></td></tr>';
  }

  GS.views.preventa = {
    title: 'Preventa',
    parent: 'preventas',
    render(el, d, id) {
      const p = findPv(id);
      if (!p) { GS.go('preventas'); return; }
      this.title = p.id;
      document.getElementById('topbar-title').textContent = 'Preventa ' + p.id;
      const operador = GS.puede('operador');
      const prov = d.proveedores.find((x) => x.id === p.proveedorId);
      const puedeAsignar = operador && p.lineas.some(editable);
      const kpi = (label, value, sub) => '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-value">' + value + '</div><div class="kpi-sub">' + sub + '</div></div>';

      el.innerHTML =
        '<a class="link back-link" data-nav="preventas">' + GS.icon('back') + 'Preventas</a>' +
        '<div class="page-head"><div><h1>' + esc(p.edicion) + '</h1>' +
        '<p>' + esc(p.id) + ' · ' + esc(p.proveedor) + ' · solicitada el ' + fmt.date(p.fecha) + ' &nbsp;' + GS.badge(GS.ESTADOS_PV, p.estado) + '</p></div>' +
        '<div class="btn-row">' +
        '<button class="btn ghost" data-action="exportarPreventa" data-id="' + esc(p.id) + '">' + GS.icon('download') + 'Exportar</button>' +
        (operador ? '<button class="btn ghost" data-action="editarPreventa" data-id="' + esc(p.id) + '">' + GS.icon('edit') + 'Editar datos</button>' : '') +
        (operador ? '<button class="btn secondary" data-action="nuevaLinea" data-id="' + esc(p.id) + '">' + GS.icon('plus', 2.4) + 'Agregar producto</button>' : '') +
        (puedeAsignar ? '<button class="btn" data-action="asignar" data-id="' + esc(p.id) + '">' + GS.icon('check') + 'Registrar asignación</button>' : '') +
        '</div></div>' +
        '<div class="kpi-grid">' +
        kpi('Unidades', fmt.num(p.unidadesAsignadas) + ' <span class="muted" style="font-size:15px;">/ ' + fmt.num(p.unidadesSolicitadas) + '</span>', 'Asignadas / solicitadas' + (p.lineasPendientes ? ' · <span class="text-gold">' + p.lineasPendientes + ' sin asignar</span>' : '')) +
        kpi('Total neto', fmt.money(p.netoVigente), 'Solicitado: ' + fmt.money(p.netoSolicitado)) +
        kpi('Total + IVA', fmt.money(iva(p.netoVigente)), 'A pagar al proveedor (sin despacho)') +
        kpi('Ganancia proyectada', '<span class="text-success">' + fmt.money(p.gananciaProyectada) + '</span>', 'Real neta, vendiendo todo al precio de venta') +
        '</div>' +
        (p.notas ? '<div class="notes-box" style="margin-bottom:16px;">' + esc(p.notas) + '</div>' : '') +
        (p.lanzamientos.length
          ? p.lanzamientos.map((x) => {
            const lineas = p.lineas.filter((l) => l.lanzamiento === x.fecha);
            const sum = (k) => lineas.reduce((s, l) => s + (l[k] || 0), 0);
            return '<div class="panel launch-panel">' +
              '<div class="panel-head"><h3>Lanzamiento ' + fmt.date(x.fecha) + ' ' + GS.relDays(x.fecha) + '</h3>' +
              '<span class="launch-info">Pedido ' + fmt.money(x.neto) + ' neto · ' + despachoAviso(x, prov) + '</span></div>' +
              '<div class="table-wrap flat"><table class="data-table xwide"><thead><tr>' +
              '<th></th><th class="col-prod">Producto</th><th>Estado</th><th class="right">Solic.</th><th class="right">Asig.</th><th class="right">Dif.</th>' +
              '<th class="right">Costo neto</th><th class="right">Costo + IVA</th><th class="right">Total neto solic.</th><th class="right">Total + IVA solic.</th>' +
              '<th class="right">Total neto asig.</th><th class="right">Total + IVA asig.</th><th class="right">PVP</th><th class="right">Precio venta</th>' +
              '<th class="right">Recargo</th><th class="right">Ganancia u.</th><th class="right">Ganancia total</th><th></th>' +
              '</tr></thead><tbody>' + lineas.map((l) => filaLinea(l, operador)).join('') + '</tbody>' +
              '<tfoot><tr><td></td><td colspan="2">Total ' + fmt.date(x.fecha) + '</td><td class="cell-num right">' + fmt.num(sum('solicitado')) + '</td>' +
              '<td class="cell-num right">' + fmt.num(lineas.reduce((s, l) => s + (l.estado === 'solicitada' ? 0 : l.asignado), 0)) + '</td><td colspan="3"></td>' +
              '<td class="cell-num right">' + fmt.money(sum('netoSolicitado')) + '</td><td class="cell-num right">' + fmt.money(iva(sum('netoSolicitado'))) + '</td>' +
              '<td class="cell-num right">' + fmt.money(sum('netoAsignado')) + '</td><td class="cell-num right">' + fmt.money(iva(sum('netoAsignado'))) + '</td>' +
              '<td colspan="4"></td><td class="cell-num right text-success">' + fmt.money(sum('gananciaTotal')) + '</td><td></td></tr></tfoot>' +
              '</table></div></div>';
          }).join('')
          : '<div class="panel">' + GS.empty('Sin productos todavía', 'Agrega los productos que vas a solicitar, cada uno con su fecha de lanzamiento.', 'preventas') + '</div>') +
        (GS.puede('admin') ? '<div class="danger-zone"><button class="btn danger-outline" data-action="eliminarPreventa" data-id="' + esc(p.id) + '">Eliminar preventa</button></div>' : '');
    },
  };

  GS.actions.exportarPreventa = (id) => {
    const p = findPv(id);
    GS.downloadCsv(p.id + '-' + p.edicion.replace(/\W+/g, '-') + '.csv',
      ['Línea', 'SKU', 'Producto', 'Idioma', 'Lanzamiento', 'Estado', 'Solicitado', 'Asignado', 'Dif', 'Costo neto', 'Costo + IVA', 'Total neto solic.', 'Total + IVA solic.',
        'Total neto asig.', 'Total + IVA asig.', 'PVP', 'Precio venta', 'Recargo %', 'Ganancia u.', 'Ganancia total'],
      p.lineas.map((l) => {
        const asignada = l.estado !== 'solicitada';
        return [l.id, l.productoId, l.producto, l.idioma, l.lanzamiento, GS.ESTADOS_LINEA[l.estado].label, l.solicitado, asignada ? l.asignado : '', asignada ? l.diferencia : '',
          l.costoNeto, Math.round(l.costoIva), Math.round(l.netoSolicitado), Math.round(iva(l.netoSolicitado)),
          asignada ? Math.round(l.netoAsignado) : '', asignada ? Math.round(iva(l.netoAsignado)) : '', l.pvp, l.precioVenta,
          Math.round(l.recargo * 100), Math.round(l.gananciaUnidad), Math.round(l.gananciaTotal)];
      }));
  };

  /* ---------- encabezado ---------- */

  /** Campos del encabezado de una preventa (formulario en línea al crear, modal al editar). */
  function preventaCampos(pv) {
    const d = data();
    const provs = d.proveedores.filter((x) => x.activo || (pv && x.id === pv.proveedorId));
    const ediciones = Array.from(new Set(d.productos.map((x) => x.edicion).concat(d.preventas.map((x) => x.edicion)).filter(Boolean))).sort();
    const p = pv || { proveedorId: (provs.find((x) => x.nombre === 'Asmodee') || provs[0] || {}).id, edicion: '', fecha: d.hoy, notas: '' };
    return '<div class="form-grid">' +
      '<div class="form-field"><label for="pv-proveedor">Proveedor *</label><select id="pv-proveedor" name="proveedorId">' + GS.options(provs.map((x) => ({ value: x.id, label: x.nombre })), p.proveedorId) + '</select></div>' +
      '<div class="form-field"><label for="pv-fecha">Fecha de solicitud</label><input id="pv-fecha" type="date" name="fecha" value="' + esc(p.fecha) + '"></div>' +
      '<div class="form-field full"><label for="pv-edicion">Edición / colección *</label><input id="pv-edicion" name="edicion" list="dl-ed-pv" value="' + esc(p.edicion) + '" placeholder="Ej: 30th Celebration">' +
      '<datalist id="dl-ed-pv">' + ediciones.map((x) => '<option value="' + esc(x) + '">').join('') + '</datalist></div>' +
      '<div class="form-field full"><label for="pv-notas">Notas</label><textarea id="pv-notas" name="notas" rows="2">' + esc(p.notas) + '</textarea></div>' +
      '</div>';
  }

  /* "Nueva preventa" despliega el formulario bajo el encabezado, sin ventana emergente. */
  let nuevaAbierta = false;

  function panelNuevaPreventa() {
    if (!nuevaAbierta) return '';
    return '<div class="panel inline-panel" id="nueva-preventa"><form novalidate>' +
      '<div class="inline-panel-head"><h3>Nueva preventa</h3><span class="muted">Después agregas los productos, cada uno con su fecha de lanzamiento.</span></div>' +
      preventaCampos(null) +
      '<div class="form-error"></div>' +
      '<div class="btn-row inline-panel-foot"><button type="button" class="btn secondary" data-action="nuevaPreventa">Cancelar</button>' +
      '<button type="submit" class="btn">Crear preventa</button></div>' +
      '</form></div>';
  }

  function conectarNuevaPreventa(el) {
    const form = el.querySelector('#nueva-preventa form');
    if (!form) return;
    GS.bindForm(form, async (v) => {
      const r = await GS.mutate('guardarPreventa', Object.assign({ id: '' }, v), (r) => 'Preventa ' + r.id + ' creada');
      nuevaAbierta = false;
      GS.go('preventa', r.id);
    });
  }

  GS.actions.nuevaPreventa = () => {
    nuevaAbierta = !nuevaAbierta;
    GS.render();
    const panel = document.getElementById('nueva-preventa');
    if (panel) {
      panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      document.getElementById('pv-edicion').focus();
    }
  };

  GS.actions.editarPreventa = (id) => {
    const pv = findPv(id);
    GS.formModal({
      title: 'Editar ' + pv.id,
      submitLabel: 'Guardar',
      fields: () => preventaCampos(pv),
      onSubmit: (v) => GS.mutate('guardarPreventa', Object.assign({ id: pv.id }, v), 'Preventa actualizada'),
    });
  };

  GS.actions.eliminarPreventa = (id) => {
    const p = findPv(id);
    GS.confirm({
      title: 'Eliminar ' + p.id,
      message: 'Se eliminará la preventa <strong>' + esc(p.edicion) + '</strong> con sus ' + p.lineas.length + ' productos. No se puede deshacer.',
      confirmLabel: 'Sí, eliminar',
      danger: true,
      onConfirm: async () => {
        await GS.mutate('eliminarPreventa', { id: id }, 'Preventa eliminada');
        GS.go('preventas');
      },
    });
  };

  /* ---------- líneas ---------- */

  function productoOptions(selectedId) {
    const prods = data().productos.filter((p) => p.activo || p.id === selectedId).sort((a, b) => a.nombreCompleto.localeCompare(b.nombreCompleto));
    return '<option value="">Selecciona un producto…</option>' +
      prods.map((p) => '<option value="' + esc(p.id) + '"' + (p.id === selectedId ? ' selected' : '') + '>' + esc(p.nombreCompleto) + ' (' + esc(p.id) + ')</option>').join('');
  }

  function lineaForm(pv, linea) {
    const ultimaFecha = pv.lineas.length ? pv.lineas[pv.lineas.length - 1].lanzamiento : '';
    const l = linea || { productoId: '', lanzamiento: ultimaFecha, solicitado: '', costoNeto: '', notas: '' };
    GS.formModal({
      title: linea ? 'Editar ' + linea.id : 'Agregar producto a ' + pv.id,
      submitLabel: linea ? 'Guardar' : 'Agregar',
      fields: () =>
        '<div class="form-grid">' +
        '<div class="form-field full"><label>Producto *</label><div class="field-row">' +
        '<select name="productoId">' + productoOptions(l.productoId) + '</select>' +
        '<button type="button" class="btn secondary small" data-action="nuevoProductoLinea" data-id="' + esc(pv.id) + '">' + GS.icon('plus') + 'Nuevo</button>' +
        '</div><span class="hint" data-precios></span></div>' +
        '<div class="form-field"><label>Fecha de lanzamiento *</label><input type="date" name="lanzamiento" value="' + esc(l.lanzamiento) + '"></div>' +
        '<div class="form-field"><label>Cantidad solicitada *</label><input type="number" name="solicitado" min="0" step="1" value="' + esc(l.solicitado) + '" placeholder="0 si lo asignaron sin pedirlo"></div>' +
        '<div class="form-field"><label>Costo neto unitario *</label><input type="number" name="costoNeto" min="0" step="0.01" value="' + esc(l.costoNeto) + '" placeholder="Precio del proveedor sin IVA"></div>' +
        '<div class="form-field"><label>Notas</label><input name="notas" value="' + esc(l.notas) + '" placeholder="Opcional"></div>' +
        '</div>' +
        '<div class="calc-grid">' +
        '<div class="calc-readout"><span class="lbl">Costo + IVA</span><span class="val" data-calc="costoIva">—</span></div>' +
        '<div class="calc-readout"><span class="lbl">Total neto</span><span class="val" data-calc="total">—</span></div>' +
        '<div class="calc-readout"><span class="lbl">Ganancia real / u.</span><span class="val text-success" data-calc="ganancia">—</span></div>' +
        '</div>',
      onMount: (form) => {
        const calc = () => {
          const prod = data().productos.find((x) => x.id === form.elements.productoId.value);
          const costo = Number(form.elements.costoNeto.value) || 0;
          const cant = Number(form.elements.solicitado.value) || 0;
          form.querySelector('[data-precios]').textContent = prod
            ? 'PVP ' + (prod.pvp ? fmt.money(prod.pvp) : '—') + ' · Precio de venta ' + (prod.precio ? fmt.money(prod.precio) + (prod.precioManual ? ' (manual)' : '') : '—')
            : '';
          form.querySelector('[data-calc=costoIva]').textContent = costo ? fmt.money(iva(costo)) : '—';
          form.querySelector('[data-calc=total]').textContent = costo && cant ? fmt.money(costo * cant) : '—';
          const precio = prod ? prod.precio : 0;
          form.querySelector('[data-calc=ganancia]').textContent = precio && costo ? fmt.money(precio / (1 + data().app.iva) - costo) : '—';
        };
        form.addEventListener('input', calc);
        form.addEventListener('change', calc);
        calc();
      },
      onSubmit: (v) => GS.mutate('guardarLineaPreventa', Object.assign({ id: linea ? linea.id : '', preventaId: pv.id }, v), linea ? 'Línea actualizada' : 'Producto agregado'),
    });
  }

  GS.actions.nuevaLinea = (id) => lineaForm(findPv(id), null);
  GS.actions.editarLinea = (lineaId) => {
    const pv = data().preventas.find((p) => p.lineas.some((l) => l.id === lineaId));
    lineaForm(pv, pv.lineas.find((l) => l.id === lineaId));
  };

  GS.actions.nuevoProductoLinea = (pvId, btn) => {
    const select = btn.closest('form').elements.productoId;
    GS.editarProducto(null, (prod) => {
      select.innerHTML = productoOptions(prod.id);
      select.dispatchEvent(new Event('change', { bubbles: true }));
    }, { edicion: findPv(pvId).edicion });
  };

  GS.actions.eliminarLinea = (lineaId) => {
    const pv = data().preventas.find((p) => p.lineas.some((l) => l.id === lineaId));
    const l = pv.lineas.find((x) => x.id === lineaId);
    GS.confirm({
      title: 'Quitar producto',
      message: '¿Quitar <strong>' + esc(l.producto) + '</strong> de la preventa ' + esc(pv.id) + '?',
      confirmLabel: 'Quitar',
      danger: true,
      onConfirm: () => GS.mutate('eliminarLineaPreventa', { id: lineaId }, 'Producto quitado de la preventa'),
    });
  };

  /* ---------- asignación ---------- */

  GS.actions.asignar = (id) => {
    const pv = findPv(id);
    const lineas = pv.lineas.filter(editable);
    GS.formModal({
      title: 'Asignación de ' + pv.proveedor + ' · ' + pv.edicion,
      size: 'wide',
      submitLabel: 'Guardar asignación',
      fields: () =>
        '<div class="notice">Escribe lo que asignó el proveedor. Viene precargado con lo solicitado (o lo ya asignado). Si no asignaron nada, deja 0. ' +
        'Puedes corregirlo mientras el producto no pase a una compra.</div>' +
        '<div class="table-wrap"><table class="data-table" style="min-width:640px;"><thead><tr>' +
        '<th class="col-prod">Producto</th><th>Lanzamiento</th><th class="right">Solicitado</th><th class="right" style="width:120px;">Asignado</th><th class="right">Dif.</th><th class="right">Total neto</th>' +
        '</tr></thead><tbody>' +
        lineas.map((l) => '<tr data-linea="' + esc(l.id) + '" data-solicitado="' + l.solicitado + '" data-costo="' + l.costoNeto + '">' +
          '<td class="cell-strong">' + esc(l.productoNombre) + ' <span class="pill lang">' + esc(l.idioma) + '</span></td>' +
          '<td class="nowrap">' + fmt.date(l.lanzamiento) + '</td>' +
          '<td class="cell-num right">' + fmt.num(l.solicitado) + '</td>' +
          '<td class="right"><input class="qty-input" type="number" min="0" step="1" name="a_' + esc(l.id) + '" value="' + (l.estado === 'solicitada' ? l.solicitado : l.asignado) + '"></td>' +
          '<td class="cell-num right" data-dif></td><td class="cell-num right" data-neto></td></tr>').join('') +
        '</tbody><tfoot><tr><td colspan="3">Total</td><td class="cell-num right" data-tot-asig></td><td></td><td class="cell-num right" data-tot-neto></td></tr></tfoot></table></div>',
      onMount: (form) => {
        const calc = () => {
          let totA = 0;
          let totN = 0;
          form.querySelectorAll('tr[data-linea]').forEach((tr) => {
            const a = Number(tr.querySelector('input').value) || 0;
            const dif = Number(tr.dataset.solicitado) - a;
            totA += a;
            totN += a * Number(tr.dataset.costo);
            tr.querySelector('[data-dif]').textContent = fmt.num(dif);
            tr.querySelector('[data-dif]').className = 'cell-num right' + (dif < 0 ? ' text-gold' : '');
            tr.querySelector('[data-neto]').textContent = fmt.money(a * Number(tr.dataset.costo));
          });
          form.querySelector('[data-tot-asig]').textContent = fmt.num(totA);
          form.querySelector('[data-tot-neto]').textContent = fmt.money(totN);
        };
        form.addEventListener('input', calc);
        calc();
      },
      onSubmit: (v) => GS.mutate('registrarAsignacion', {
        preventaId: id,
        lineas: lineas.map((l) => ({ id: l.id, asignado: v['a_' + l.id] })),
      }, 'Asignación registrada'),
    });
  };
})();
</script>
