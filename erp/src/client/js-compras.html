<script>
/* =========================================================
   Compras (facturas de proveedores) e Inventario (un lote por
   línea de factura, con vista unidad por unidad como la planilla).
   Las facturas se crean desde Preventas: se seleccionan las
   preventas asignadas y se registra el N° de factura.
========================================================= */
(function () {
  'use strict';
  const { fmt, esc } = GS;
  const data = () => GS.state.data;
  const abiertas = new Set();   // facturas con el detalle desplegado
  const DEF_C = { q: '' };
  const DEF_I = { q: '', agotados: false };
  const signo = (n) => (n < 0 ? 'text-danger' : 'text-success');
  const kpi = (l, v, sub) => '<div class="kpi-card"><div class="kpi-label">' + l + '</div><div class="kpi-value small">' + v + '</div><div class="kpi-sub">' + sub + '</div></div>';
  const buscar = (lista, q, texto) => { const n = GS.norm(q.trim()); return lista.filter((x) => !n || GS.norm(texto(x)).includes(n)); };

  /* ---------- Compras ---------- */

  const ESTADO_VENTA = { sin_ventas: 'Sin ventas', vendiendo: 'Vendiendo', vendida: 'Vendida completa' };
  const colsCompras = [
    { id: 'fecha', label: 'Fecha', valor: (c) => c.fecha, texto: (c) => fmt.date(c.fecha), celda: (c) => '<span class="nowrap">' + fmt.date(c.fecha) + '</span>' },
    { id: 'proveedor', label: 'Proveedor', valor: (c) => c.proveedor, celda: (c) => esc(c.proveedor) },
    { id: 'factura', label: 'Factura', valor: (c) => c.factura, celda: (c) => '<span class="cell-strong">' + esc(c.factura) + '</span>' },
    { id: 'productos', label: 'Productos', right: true, valor: (c) => c.lineas.length, celda: (c) => fmt.num(c.lineas.length) },
    { id: 'unidades', label: 'Unidades', right: true, valor: (c) => c.unidades, celda: (c) => fmt.num(c.unidades) },
    { id: 'neto', label: 'Neto', right: true, valor: (c) => c.neto, texto: (c) => fmt.money(c.neto), celda: (c) => fmt.money(c.neto) },
    { id: 'iva', label: 'IVA', right: true, valor: (c) => c.iva, texto: (c) => fmt.money(c.iva), celda: (c) => fmt.money(c.iva) },
    { id: 'total', label: 'Total', right: true, valor: (c) => c.total, texto: (c) => fmt.money(c.total), celda: (c) => '<strong>' + fmt.money(c.total) + '</strong>' },
    // Resultado de la factura: se acumula con cada venta de sus productos (Ventas, etapa 3).
    { id: 'vendidas', label: 'Vendidas', right: true, clase: 'col-res', valor: (c) => c.vendidas / (c.unidades || 1), texto: (c) => c.vendidas + ' / ' + c.unidades,
      celda: (c) => fmt.num(c.vendidas) + '<span class="cell-dim"> / ' + fmt.num(c.unidades) + '</span>' +
        '<div class="barra-venta"><span style="width:' + Math.round(100 * c.vendidas / (c.unidades || 1)) + '%"></span></div>' },
    { id: 'ventas', label: 'Ventas acumuladas', right: true, valor: (c) => c.ventasAcumuladas, texto: (c) => fmt.money(c.ventasAcumuladas), celda: (c) => fmt.money(c.ventasAcumuladas) },
    { id: 'ganancia', label: 'Ganancia acumulada', right: true, valor: (c) => c.gananciaAcumulada, texto: (c) => fmt.money(c.gananciaAcumulada),
      celda: (c) => '<strong class="' + (c.gananciaAcumulada < 0 ? 'text-danger' : c.gananciaAcumulada > 0 ? 'text-success' : '') + '">' + fmt.money(c.gananciaAcumulada) + '</strong>' +
        '<div class="cell-dim">de ' + fmt.money(c.gananciaProyectada) + ' proyectada</div>' },
    { id: 'estadoVenta', label: 'Estado', valor: (c) => ESTADO_VENTA[c.estadoVenta], celda: (c) =>
      '<span class="badge ' + { sin_ventas: 'st-pedido', vendiendo: 'st-parcial', vendida: 'st-ok' }[c.estadoVenta] + '">' + ESTADO_VENTA[c.estadoVenta] + '</span>' },
  ];
  const buscadasCompras = () => buscar(data().compras, GS.filters('compras', DEF_C).q, (c) => c.id + ' ' + c.factura + ' ' + c.proveedor + ' ' + c.lineas.map((l) => l.producto + ' ' + l.preventaId).join(' '));
  GS.tablaRegistrar('compras', { filas: buscadasCompras, columnas: colsCompras, alCambiar: () => GS.views.compras.update() });

  function detalleCompra(c) {
    const fila = (l) => '<tr><td>' + GS.thumb(l.imagen) + '</td><td class="cell-strong">' + esc(l.productoNombre) + ' ' + GS.langPill(l.idioma) +
      '<div class="cell-dim">' + esc(l.preventaId) + (l.edicion ? ' · ' + esc(l.edicion) : '') + '</div></td>' +
      '<td class="cell-num right">' + fmt.num(l.cantidad) + '</td><td class="cell-num right">' + fmt.cost(l.costoNeto) + '</td>' +
      '<td class="cell-num right">' + fmt.money(l.netoLinea) + '</td><td class="cell-num right col-inv">' + fmt.money(l.despacho) + '</td>' +
      '<td class="cell-num right cell-strong">' + fmt.cost(l.costo) + '</td></tr>';
    const total = (l, v, cls) => '<tr class="' + (cls || '') + '"><td colspan="4" class="right">' + l + '</td><td class="cell-num right">' + v + '</td><td class="col-inv" colspan="2"></td></tr>';
    // Como la factura de Asmodee: el despacho es una fila más cuando se cobra.
    const filaDespacho = c.despacho
      ? '<tr class="item-despacho"><td></td><td class="cell-strong">Despacho</td><td class="cell-num right">1</td><td class="cell-num right">' + fmt.money(c.despacho) + '</td>' +
        '<td class="cell-num right">' + fmt.money(c.despacho) + '</td><td class="cell-dim right col-inv" colspan="2">prorrateado en los productos ↑</td></tr>'
      : '';
    return '<div class="detalle-compra"><table class="data-table"><thead><tr><th></th><th>Ítem</th><th class="right">Cant.</th><th class="right">Precio unidad</th><th class="right">Total neto</th>' +
      '<th class="right col-inv">Despacho prorrateado</th><th class="right">Costo unidad en inventario</th></tr></thead><tbody>' +
      c.lineas.map(fila).join('') + filaDespacho +
      '</tbody><tfoot>' +
      total('Neto', fmt.money(c.neto)) + total('IVA 19%', fmt.money(c.iva)) + total('<strong>Total factura</strong>', '<strong>' + fmt.money(c.total) + '</strong>', 'total-row') +
      '</tfoot></table>' +
      (c.despacho ? '' : '<p class="table-note text-success">✓ Sin cobro de despacho' + (c.despachoGratisDesde ? ' (neto ≥ ' + fmt.money(c.despachoGratisDesde) + ')' : '') + '</p>') +
      (c.notas ? '<p class="table-note">Notas: ' + esc(c.notas) + '</p>' : '') + '</div>';
  }

  GS.views.compras = {
    title: 'Compras',
    render(el) {
      const f = GS.filters('compras', DEF_C);
      if (GS.state.param) { abiertas.add(GS.state.param); GS.state.param = null; }
      el.innerHTML =
        '<div class="page-head"><div><h1>Compras</h1><p>Facturas de proveedores. Se crean desde Preventas seleccionando las preventas asignadas que vienen en la factura.</p></div>' +
        (GS.puede('operador') ? '<button class="btn" data-nav="preventas">' + GS.icon('plus', 2.4) + 'Nueva factura desde Preventas</button>' : '') + '</div>' +
        '<div class="filters-bar"><div class="search-box">' + GS.icon('search') + '<input type="text" data-filter="compras.q" value="' + esc(f.q) + '" placeholder="Buscar factura, producto o PVI..."></div></div>' +
        '<div id="cp-resumen"></div>' +
        '<div class="table-wrap"><table class="data-table wide"><thead><tr id="cp-thead"></tr></thead><tbody id="cp-tbody"></tbody></table></div>' +
        '<p class="table-note">El despacho se reparte entre los productos según su participación en $ del neto de la factura, y queda incluido en el costo de cada unidad del inventario.</p>';
      this.update();
    },
    update() {
      const rows = GS.tablaAplicar('compras', buscadasCompras(), colsCompras);
      const admin = GS.puede('admin');
      document.getElementById('cp-thead').innerHTML = '<th></th>' + GS.tablaEncabezado('compras', colsCompras) + '<th></th>';
      const n = colsCompras.length + 2;
      document.getElementById('cp-tbody').innerHTML = rows.length
        ? rows.map((c) => {
          const open = abiertas.has(c.id);
          return '<tr class="fila-compra' + (open ? ' abierta' : '') + '" data-action="verCompra" data-id="' + esc(c.id) + '">' +
            '<td><span class="chev">' + (open ? '▾' : '▸') + '</span></td>' +
            colsCompras.map((col) => '<td class="' + (col.right ? 'cell-num right ' : '') + (col.clase || '') + '">' + col.celda(c) + '</td>').join('') +
            '<td><div class="row-actions">' + (admin ? GS.iconBtn('anularCompra', c.id, 'trash', 'Anular factura', 'danger') : '') + '</div></td></tr>' +
            (open ? '<tr class="detalle-row"><td colspan="' + n + '">' + detalleCompra(c) + '</td></tr>' : '');
        }).join('')
        : '<tr><td colspan="' + n + '">' + GS.empty('Aún no hay facturas', 'En Preventas, selecciona las preventas asignadas que vienen en la factura y presiona "Crear factura de compra".', 'compras') + '</td></tr>';
      // El detalle queda fijo al ancho visible aunque la lista de facturas se desplace hacia el lado.
      const wrap = document.getElementById('cp-tbody').closest('.table-wrap');
      document.querySelectorAll('.detalle-compra').forEach((d) => { d.style.width = Math.max(320, wrap.clientWidth - 36) + 'px'; });
      const sum = (k) => rows.reduce((t, c) => t + c[k], 0);
      document.getElementById('cp-resumen').innerHTML = '<div class="kpi-grid">' +
        kpi('Facturas', rows.length, fmt.num(sum('vendidas')) + ' de ' + fmt.num(sum('unidades')) + ' unidades vendidas') +
        kpi('Total facturado', fmt.money(sum('total')), fmt.money(sum('neto')) + ' neto + ' + fmt.money(sum('iva')) + ' IVA') +
        kpi('Ventas acumuladas', fmt.money(sum('ventasAcumuladas')), 'De los productos de estas facturas') +
        kpi('Ganancia acumulada', '<span class="text-success">' + fmt.money(sum('gananciaAcumulada')) + '</span>', 'de ' + fmt.money(sum('gananciaProyectada')) + ' proyectada vendiendo todo') + '</div>';
    },
  };

  GS.actions.verCompra = (id, el) => {
    if (el && el.closest('.row-actions')) return;
    if (abiertas.has(id)) abiertas.delete(id); else abiertas.add(id);
    GS.views.compras.update();
  };

  GS.actions.anularCompra = (id) => {
    const c = data().compras.find((x) => x.id === id);
    GS.confirm({
      title: 'Anular factura ' + c.factura,
      message: 'Se borra la factura <strong>' + esc(c.factura) + '</strong> de ' + esc(c.proveedor) + ', sus ' + c.lineas.length + ' productos salen del inventario y sus preventas vuelven a <strong>Asignada</strong>. Úsalo solo para corregir una factura mal ingresada. Queda registrado en la auditoría.',
      confirmLabel: 'Sí, anular',
      danger: true,
      onConfirm: () => GS.mutate('anularCompra', { id: id }, 'Factura ' + c.factura + ' anulada'),
    });
  };

  /* ---------- Inventario ----------
     Una fila por lote (producto de una factura). La flecha despliega sus unidades una por una,
     como la planilla, con la OC y el cliente de las vendidas. Desde aquí se toma el stock para vender. */

  const lotesAbiertos = new Set();
  const selStock = new Set();   // lotes marcados para vender

  const producto = (l) => '<div class="prod-cell">' + GS.thumb(l.imagen) + '<div><span class="cell-strong">' + esc(l.productoNombre) + '</span> ' + GS.langPill(l.idioma) +
    '<div class="cell-dim">' + esc(l.edicion || '') + '</div></div></div>';
  const colsLote = [
    { id: 'producto', label: 'Producto', clase: 'col-prod', valor: (l) => l.productoNombre, texto: (l) => l.productoNombre + ' ' + l.idioma, celda: producto },
    { id: 'factura', label: 'Factura', valor: (l) => l.factura, celda: (l) => '<span class="cell-strong">' + esc(l.factura) + '</span><div class="cell-dim">' + esc(l.proveedor) + '</div>' },
    { id: 'fecha', label: 'Fecha', valor: (l) => l.fecha, texto: (l) => fmt.date(l.fecha), celda: (l) => '<span class="nowrap">' + fmt.date(l.fecha) + '</span>' },
    { id: 'cantidad', label: 'Comprado', right: true, valor: (l) => l.cantidad, celda: (l) => fmt.num(l.cantidad) },
    { id: 'vendidas', label: 'Vendidas', right: true, valor: (l) => l.vendidas, celda: (l) => (l.vendidas ? fmt.num(l.vendidas) : '—') },
    { id: 'disponible', label: 'Disponible', right: true, valor: (l) => l.disponible, celda: (l) => '<strong class="stock-num">' + fmt.num(l.disponible) + '</strong>' },
    { id: 'costo', label: 'Costo u.', right: true, valor: (l) => l.costo, texto: (l) => fmt.money(l.costo),
      celda: (l) => '<strong>' + fmt.money(l.costo) + '</strong><div class="cell-dim">' + fmt.cost(l.costoNeto) + ' + ' + fmt.money(l.despachoUnidad) + ' desp.</div>' },
    { id: 'precio', label: 'Precio venta', right: true, valor: (l) => l.precioVenta, texto: (l) => fmt.money(l.precioVenta), celda: (l) => (l.precioVenta ? fmt.money(l.precioVenta) : '—') },
    { id: 'ganT', label: 'Ganancia', right: true, valor: (l) => l.gananciaProyectada, texto: (l) => fmt.money(l.gananciaProyectada),
      celda: (l) => (l.precioVenta ? '<span class="' + signo(l.gananciaProyectada) + '">' + fmt.money(l.gananciaProyectada) + '</span>' : '—') + '<div class="cell-dim">' + fmt.money(l.gananciaUnidad) + ' c/u</div>' },
  ];

  const textoLote = (l) => l.id + ' ' + l.factura + ' ' + l.producto + ' ' + l.proveedor + ' ' + l.preventaId;
  const buscadasLotes = () => buscar(data().lotes, GS.filters('inventario', DEF_I).q, textoLote);
  GS.tablaRegistrar('lotes', { filas: buscadasLotes, columnas: colsLote, alCambiar: () => GS.views.inventario.update() });

  /** Unidades del lote, una por fila (Serie 1…N): las primeras son las vendidas, en orden de venta. */
  function detalleLote(l) {
    const m = (v) => '<td class="cell-num right">' + fmt.money(v) + '</td>';
    const filas = [];
    for (let i = 1; i <= l.cantidad; i++) {
      const u = l.unidadesVendidas[i - 1];
      filas.push('<tr' + (u ? '' : ' class="unidad-libre"') + '><td class="cell-num right">' + i + '<span class="cell-dim"> / ' + l.cantidad + '</span></td>' +
        '<td>' + (u ? '<span class="badge st-parcial">Vendida</span>' : '<span class="badge st-ok">Disponible</span>') + '</td>' +
        '<td>' + (u ? '<span class="cell-strong">' + esc(u.oc) + '</span>' : '—') + '</td><td>' + (u ? esc(u.cliente) : '—') + '</td>' +
        m(l.valorUnitario) + m(l.costo) + m(l.credito) + m(u ? u.precio : l.precioVenta) +
        m((u ? u.precio : l.precioVenta) / (1 + data().app.iva)) +
        m((u ? u.precio : l.precioVenta) - (u ? u.precio : l.precioVenta) / (1 + data().app.iva)) +
        m((u ? u.precio : l.precioVenta) - (u ? u.precio : l.precioVenta) / (1 + data().app.iva) - l.credito) +
        '<td class="cell-num right ' + signo((u ? u.precio : l.precioVenta) / (1 + data().app.iva) - l.costo) + '">' + fmt.money((u ? u.precio : l.precioVenta) / (1 + data().app.iva) - l.costo) + '</td></tr>');
    }
    return '<div class="detalle-compra"><table class="data-table"><thead><tr><th class="right">Serie</th><th>Estado</th><th>OC</th><th>Cliente</th>' +
      '<th class="right">Valor unitario</th><th class="right">Costo</th><th class="right">Crédito fiscal</th><th class="right">$ Venta</th><th class="right">Neto</th>' +
      '<th class="right">Débito fiscal</th><th class="right">Pago SII</th><th class="right">Ganancia</th></tr></thead><tbody>' + filas.join('') + '</tbody></table>' +
      '<p class="table-note">Las vendidas muestran el precio real de su venta; las disponibles, el precio de venta actual.</p></div>';
  }

  GS.views.inventario = {
    title: 'Inventario',
    render(el) {
      const f = GS.filters('inventario', DEF_I);
      el.innerHTML =
        '<div class="page-head"><div><h1>Inventario</h1><p>Un lote por producto de cada factura. Despliega un lote para ver sus unidades una por una; marca los que quieras vender y presiona "Vender".</p></div>' +
        '<button class="btn ghost" data-action="exportarInventario">' + GS.icon('download') + 'Exportar</button></div>' +
        '<div class="filters-bar"><div class="search-box">' + GS.icon('search') + '<input type="text" data-filter="inventario.q" value="' + esc(f.q) + '" placeholder="Buscar producto, factura o PVI..."></div>' +
        '<label class="check"><input type="checkbox" data-filter="inventario.agotados"' + (f.agotados ? ' checked' : '') + '> Mostrar agotados</label></div>' +
        '<div id="inv-resumen"></div>' +
        '<div id="inv-acciones"></div>' +
        '<div class="table-wrap"><table class="data-table compacta"><thead><tr id="inv-thead"></tr></thead><tbody id="inv-tbody"></tbody></table></div>' +
        '<p class="table-note">Costo = precio unidad neto + despacho prorrateado. Crédito fiscal = costo × 19%. Ganancia = precio de venta sin IVA − costo. El precio de venta es el del producto (el propio o el sugerido).</p>';
      this.update();
    },
    update() {
      const f = GS.filters('inventario', DEF_I);
      const rows = GS.tablaAplicar('lotes', buscadasLotes(), colsLote).filter((l) => f.agotados || l.disponible > 0);
      const op = GS.puede('operador');
      const n = colsLote.length + 3;
      document.getElementById('inv-thead').innerHTML = '<th></th><th></th>' + GS.tablaEncabezado('lotes', colsLote) + '<th></th>';
      document.getElementById('inv-tbody').innerHTML = rows.length ? rows.map((l) => {
        const open = lotesAbiertos.has(l.id);
        const vendible = op && l.disponible > 0;
        return '<tr class="fila-compra' + (open ? ' abierta' : '') + (l.disponible ? '' : ' row-muted') + (selStock.has(l.id) ? ' row-selected' : '') + '" data-action="verLote" data-id="' + esc(l.id) + '" data-lote="' + esc(l.id) + '">' +
          '<td><span class="chev">' + (open ? '▾' : '▸') + '</span></td>' +
          '<td>' + (vendible ? '<input type="checkbox" class="row-check" data-sel-stock="' + esc(l.id) + '"' + (selStock.has(l.id) ? ' checked' : '') + ' aria-label="Seleccionar ' + esc(l.producto) + '">' : '') + '</td>' +
          colsLote.map((c) => '<td class="' + (c.right ? 'cell-num right ' : '') + (c.clase || '') + '">' + c.celda(l) + '</td>').join('') +
          '<td><div class="row-actions">' + (vendible ? '<button class="btn small secondary" data-action="venderStock" data-id="' + esc(l.id) + '">' + GS.icon('ventas') + 'Vender</button>' : '') +
          (op ? GS.iconBtn('editarProducto', l.productoId, 'edit', 'Editar nombre, foto o precio') : '') + '</div></td></tr>' +
          (open ? '<tr class="detalle-row"><td colspan="' + n + '">' + detalleLote(l) + '</td></tr>' : '');
      }).join('') : '<tr><td colspan="' + n + '">' + GS.empty('No hay stock disponible', 'Los productos entran al registrar su factura de compra desde Preventas.', 'inventario') + '</td></tr>';
      const wrap = document.getElementById('inv-tbody').closest('.table-wrap');
      document.querySelectorAll('#inv-tbody .detalle-compra').forEach((d) => { d.style.width = Math.max(320, wrap.clientWidth - 36) + 'px'; });
      barraStock();

      const disp = rows.reduce((t, l) => t + l.disponible, 0);
      const sum = (k) => rows.reduce((t, l) => t + l[k], 0);
      const credito = rows.reduce((t, l) => t + l.credito * l.disponible, 0);
      const productos = new Set(rows.filter((l) => l.disponible > 0).map((l) => l.productoId)).size;
      document.getElementById('inv-resumen').innerHTML = '<div class="kpi-grid">' +
        kpi('Unidades disponibles', fmt.num(disp), productos + (productos === 1 ? ' producto' : ' productos')) +
        kpi('Valor a costo', fmt.money(sum('valorInventario')), fmt.money(credito) + ' de crédito fiscal') +
        kpi('Venta proyectada', fmt.money(sum('ventaProyectada')), 'Vendiendo todo al precio de venta') +
        kpi('Ganancia proyectada', '<span class="text-success">' + fmt.money(sum('gananciaProyectada')) + '</span>', 'Real neta') + '</div>';
    },
  };

  GS.actions.verLote = (id, el) => {
    if (lotesAbiertos.has(id)) lotesAbiertos.delete(id); else lotesAbiertos.add(id);
    GS.views.inventario.update();
  };

  function barraStock() {
    const el = document.getElementById('inv-acciones');
    if (!selStock.size) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="action-bar">' + GS.icon('check') + '<span><strong>' + selStock.size + '</strong> ' + (selStock.size === 1 ? 'producto seleccionado' : 'productos seleccionados') + '</span>' +
      '<button class="btn small" data-action="venderSeleccion">' + GS.icon('ventas') + 'Vender seleccionados</button>' +
      '<button class="btn ghost small" data-action="limpiarStock">Quitar selección</button></div>';
  }
  document.addEventListener('click', (e) => {
    // Marcar un lote no despliega la fila.
    if (e.target.dataset && e.target.dataset.selStock) e.stopPropagation();
  }, true);
  document.addEventListener('change', (e) => {
    const id = e.target.dataset && e.target.dataset.selStock;
    if (!id) return;
    if (e.target.checked) selStock.add(id); else selStock.delete(id);
    e.target.closest('tr').classList.toggle('row-selected', e.target.checked);
    barraStock();
  });
  /** Lleva los productos de los lotes al carrito de Ventas (1 unidad de cada uno; la cantidad se ajusta allá). */
  function vender(loteIds) {
    const prods = Array.from(new Set(loteIds.map((id) => (data().lotes.find((l) => l.id === id) || {}).productoId).filter(Boolean)));
    prods.forEach((id) => GS.agregarAVenta(id, 1));
    selStock.clear();
    GS.go('ventas');
    GS.toast(prods.length === 1 ? 'Producto agregado a la venta' : prods.length + ' productos agregados a la venta');
  }
  GS.actions.venderStock = (id) => vender([id]);
  GS.actions.venderSeleccion = () => vender(Array.from(selStock));
  GS.actions.limpiarStock = () => { selStock.clear(); GS.views.inventario.update(); };

  GS.actions.exportarInventario = () => {
    const filas = [];
    data().lotes.forEach((l) => {
      for (let i = 1; i <= l.cantidad; i++) {
        const u = l.unidadesVendidas[i - 1];
        filas.push([l.proveedor, l.factura, l.id, i, l.productoId, l.producto, u ? 'Vendida' : 'Disponible', u ? u.oc : '', u ? u.cliente : '', Math.round(l.valorUnitario), Math.round(l.costo),
          Math.round(l.credito), l.precioVenta, Math.round(l.ventaNeta), Math.round(l.debito), Math.round(l.pagoSii), Math.round(l.gananciaUnidad)]);
      }
    });
    GS.downloadCsv('inventario-' + data().hoy + '.csv',
      ['Proveedor', 'Factura', 'Lote', 'Serie', 'SKU', 'Producto', 'Estado', 'OC', 'Cliente', 'Valor unitario', 'Costo', 'Crédito fiscal', '$ Venta', 'Neto', 'Débito fiscal', 'Pago SII', 'Ganancia'], filas);
  };
})();
</script>
