<script>
/* =========================================================
   Finanzas: resumen mensual (ventas, compras, gastos, aportes
   y flujo) y libro de movimientos (aportes, GAV, GOPM, SII,
   comisiones, compras por monto como singles o bazar…).
========================================================= */
(function () {
  'use strict';
  const { fmt, esc } = GS;
  const data = () => GS.state.data;
  const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  const kpi = (l, v, sub) => '<div class="kpi-card"><div class="kpi-label">' + l + '</div><div class="kpi-value small">' + v + '</div><div class="kpi-sub">' + sub + '</div></div>';
  const DEF = { tab: 'resumen', anio: '', q: '', ventas: true };

  const movsVivos = () => (data().movimientos || []).filter((m) => !m.anulado);
  const anios = () => {
    const s = new Set([data().hoy.slice(0, 4)]);
    data().ventas.forEach((v) => s.add(v.fecha.slice(0, 4)));
    (data().movimientos || []).forEach((m) => s.add(m.fecha.slice(0, 4)));
    data().compras.forEach((c) => s.add(String(c.fecha).slice(0, 4)));
    return Array.from(s).filter((a) => /^\d{4}$/.test(a)).sort().reverse();
  };

  /** Filas del resumen: { label, valores[12], tipo: 'ingreso'|'egreso'|'total'|'sub' }. */
  function resumen(anio) {
    const mes = (f) => (String(f).slice(0, 4) === anio ? Number(String(f).slice(5, 7)) - 1 : -1);
    const fila = (label, clase) => ({ label: label, clase: clase || '', valores: new Array(12).fill(0) });
    const porCat = {};
    const prodVentas = fila('Ventas de productos');
    let iva = new Array(12).fill(0);
    data().ventas.filter((v) => !v.anulada).forEach((v) => {
      const i = mes(v.fecha);
      if (i < 0) return;
      iva[i] += v.iva;
      v.lineas.forEach((l) => {
        if (l.porMonto) (porCat[l.categoria] = porCat[l.categoria] || fila('Ventas · ' + l.categoria)).valores[i] += l.subtotal;
        else prodVentas.valores[i] += l.subtotal;
      });
    });
    const ventas = [prodVentas].concat(data().catalogos.categoriasVenta.filter((c) => porCat[c]).map((c) => porCat[c]));
    const totalVentas = fila('Total ventas', 'subtotal');
    ventas.forEach((f) => f.valores.forEach((x, i) => { totalVentas.valores[i] += x; }));

    const cats = data().catalogos.categoriasMovimiento;
    const porMov = {};
    movsVivos().forEach((m) => {
      const i = mes(m.fecha);
      if (i < 0) return;
      const k = m.tipo + '|' + m.categoria;
      (porMov[k] = porMov[k] || fila(cats[m.tipo][m.categoria] || m.categoria)).valores[i] += m.monto;
    });
    const ingresos = Object.keys(cats.ingreso).map((c) => porMov['ingreso|' + c]).filter(Boolean);

    // Compras con factura: en el flujo cuentan en el mes en que se pagaron (pagos conciliados desde la
    // caja); lo no pagado, en el mes de la factura. El crédito fiscal (IVA) va siempre por la factura.
    const facturas = fila('Compras con factura (según pago)');
    const credito = new Array(12).fill(0);
    const pagos = {};
    (data().pagosFacturas || []).forEach((p) => { (pagos[p.compraId] = pagos[p.compraId] || []).push(p); });
    data().compras.forEach((c) => {
      const iFac = mes(c.fecha);
      if (iFac >= 0) credito[iFac] += c.iva;
      const suyos = pagos[c.id] || [];
      let pagado = 0;
      suyos.forEach((p) => { pagado += p.monto; const i = mes(p.fecha); if (i >= 0) facturas.valores[i] += p.monto; });
      const resto = c.total - pagado;
      if (iFac >= 0 && (!suyos.length || resto > 2000)) facturas.valores[iFac] += suyos.length ? resto : c.total;
    });
    // Uso interno: lo pagado por esas unidades pasa de compras de mercadería a GOPM (al costo con IVA, en el mes de la salida).
    const internoGopm = fila(cats.egreso.gopm || 'GOPM');
    (data().salidas || []).filter((x) => x.motivo === 'interno').forEach((x) => {
      const i = mes(x.fecha);
      if (i < 0) return;
      const v = Math.round(x.costo * x.cantidad * (1 + data().app.iva));
      facturas.valores[i] -= v;
      (porMov['egreso|gopm'] = porMov['egreso|gopm'] || internoGopm).valores[i] += v;
    });
    // Egresos con factura (bazar, aseo, insumos…): su IVA también es crédito fiscal.
    movsVivos().forEach((m) => { const i = mes(m.fecha); if (i >= 0 && m.tipo === 'egreso' && m.iva) credito[i] += m.iva; });
    const egresos = [facturas].concat(Object.keys(cats.egreso).map((c) => porMov['egreso|' + c]).filter(Boolean));
    const comisionesTuu = fila('Comisiones TUU (ventas)');
    data().ventas.filter((v) => !v.anulada).forEach((v) => { const i = mes(v.fecha); if (i >= 0) comisionesTuu.valores[i] += v.comision || 0; });
    if (comisionesTuu.valores.some(Boolean)) egresos.push(comisionesTuu);
    const totalEgresos = fila('Total egresos', 'subtotal');
    egresos.forEach((f) => f.valores.forEach((x, i) => { totalEgresos.valores[i] += x; }));

    const flujo = fila('Flujo del mes', 'total');
    for (let i = 0; i < 12; i++) flujo.valores[i] = totalVentas.valores[i] + ingresos.reduce((t, f) => t + f.valores[i], 0) - totalEgresos.valores[i];
    const acumulado = fila('Flujo acumulado del año', 'sub');
    flujo.valores.reduce((t, x, i) => { acumulado.valores[i] = t + x; return t + x; }, 0);

    // Singles: ventas de singles contra compras de singles (por lote).
    const singlesV = fila('Ventas de singles');
    singlesV.valores = (porCat.Singles || fila('')).valores.slice();
    const singlesC = fila('Compras de singles');
    movsVivos().filter((m) => m.categoria === 'compra' && /single/i.test(m.subcategoria)).forEach((m) => { const i = mes(m.fecha); if (i >= 0) singlesC.valores[i] += m.monto; });
    const singlesR = fila('Resultado singles', 'subtotal');
    singlesR.valores = singlesV.valores.map((x, i) => x - singlesC.valores[i]);

    const ivaF = fila('IVA estimado (débito − crédito)', 'sub');
    ivaF.valores = iva.map((x, i) => x - credito[i]);

    return { ventas, totalVentas, ingresos, egresos, totalEgresos, flujo, acumulado, singles: [singlesV, singlesC, singlesR], iva: ivaF };
  }

  function tablaResumen(r) {
    const total = (f) => f.valores.reduce((t, x) => t + x, 0);
    const fila = (f, signo) => '<tr class="' + f.clase + '"><td class="cell-strong nowrap">' + esc(f.label) + '</td>' +
      f.valores.map((x) => '<td class="cell-num right' + (signo && x < 0 ? ' text-danger' : '') + '">' + (x ? fmt.money(x) : '—') + '</td>').join('') +
      '<td class="cell-num right"><strong' + (signo && total(f) < 0 ? ' class="text-danger"' : '') + '>' + fmt.money(f.clase === 'sub' && f.label.indexOf('acumulado') !== -1 ? f.valores[11] : total(f)) + '</strong></td></tr>';
    const grupo = (t) => '<tr class="fin-grupo"><td colspan="14">' + t + '</td></tr>';
    return '<div class="table-wrap"><table class="data-table resumen-mensual fin-resumen"><thead><tr><th></th>' + MESES.map((m) => '<th class="right">' + m + '</th>').join('') + '<th class="right">Total</th></tr></thead><tbody>' +
      grupo('Ventas') + r.ventas.map((f) => fila(f)).join('') + fila(r.totalVentas) +
      (r.ingresos.length ? grupo('Otros ingresos') + r.ingresos.map((f) => fila(f)).join('') : '') +
      grupo('Egresos') + r.egresos.map((f) => fila(f)).join('') + fila(r.totalEgresos) +
      grupo('Resultado de caja') + fila(r.flujo, true) + fila(r.acumulado, true) +
      grupo('Singles (por lote)') + r.singles.map((f, i) => fila(f, i === 2)).join('') +
      grupo('Impuestos') + fila(r.iva, true) +
      '</tbody></table></div>' +
      '<p class="table-note">Ventas y compras con factura incluyen IVA. Las compras con factura cuentan en el mes en que se pagaron (pagos conciliados desde la caja); si no hay pago registrado, en el mes de la factura. Flujo del mes = ventas + otros ingresos − egresos. ' +
      'Los productos sacados del inventario para uso interno se suman a GOPM al costo con IVA y se restan de las compras con factura (el total de egresos no cambia). ' +
      'IVA estimado = IVA de las ventas − IVA de las facturas de compra y de los gastos marcados "con factura".</p>';
  }

  /* ---------- movimientos ---------- */

  const tipoLabel = { ingreso: 'Ingreso', egreso: 'Egreso' };
  const colsMov = [
    { id: 'fecha', label: 'Fecha', clase: 'nowrap', valor: (m) => m.fecha, texto: (m) => fmt.date(m.fecha), celda: (m) => fmt.date(m.fecha) },
    { id: 'tipo', label: 'Tipo', valor: (m) => tipoLabel[m.tipo], celda: (m) => '<span class="badge ' + (m.tipo === 'ingreso' ? 'st-ok' : 'st-pedido') + '">' + tipoLabel[m.tipo] + '</span>' },
    { id: 'categoria', label: 'Categoría', valor: (m) => m.categoriaLabel, celda: (m) => '<span class="cell-strong">' + esc(m.categoriaLabel) + '</span>' },
    { id: 'detalle', label: 'Detalle', valor: (m) => m.subcategoria || '', celda: (m) => esc(m.subcategoria || '—') + (m.notas ? '<div class="cell-dim">' + esc(m.notas) + '</div>' : '') },
    { id: 'cuenta', label: 'Cuenta', valor: (m) => m.cuentaLabel || 'Sin cuenta', celda: (m) => esc(m.cuentaLabel || '—') },
    { id: 'ref', label: 'Referencia', valor: (m) => m.referencia || '', celda: (m) => '<span class="cell-dim">' + esc(m.referencia || '') + '</span>' },
    { id: 'monto', label: 'Monto', right: true, valor: (m) => (m.tipo === 'ingreso' ? m.monto : -m.monto), texto: (m) => fmt.money(m.monto),
      celda: (m) => '<strong class="' + (m.anulado ? 'muted' : m.tipo === 'ingreso' ? 'text-success' : '') + '">' + (m.tipo === 'ingreso' ? '+' : '−') + fmt.money(m.monto) + '</strong>' + (m.anulado ? '<div class="cell-dim">anulado</div>' : '') },
  ];
  /** Ingresos de ventas como filas del libro (solo lectura): lo pagado al vender, los abonos y la comisión del medio de pago. */
  const CUENTA_MEDIO = { efectivo: 'Caja (efectivo)', transferencia: 'Banco', debito: 'TUU', credito: 'TUU' };
  function movsVentas() {
    const res = [];
    data().ventas.filter((v) => !v.anulada).forEach((v) => {
      const base = { tipo: 'ingreso', referencia: v.id, venta: v.id, cuentaLabel: CUENTA_MEDIO[v.medioPago] || '', notas: '' };
      if (v.abono) res.push(Object.assign({}, base, { id: v.id + '·v', fecha: v.fecha, categoriaLabel: 'Venta', subcategoria: v.cliente + ' · ' + v.medioPagoLabel, monto: v.abono }));
      v.cobros.forEach((c) => res.push(Object.assign({}, base, { id: c.id, fecha: c.fecha, categoriaLabel: 'Abono de venta', subcategoria: v.cliente + ' · ' + (data().catalogos.mediosPago[c.medioPago] || c.medioPago), monto: c.monto,
        cuentaLabel: CUENTA_MEDIO[c.medioPago] || '' })));
      if (v.comision) res.push(Object.assign({}, base, { id: v.id + '·c', tipo: 'egreso', fecha: v.fecha, categoriaLabel: 'Comisión ' + v.medioPagoLabel, subcategoria: v.cliente, monto: v.comision }));
    });
    // Pagos de facturas de compra: registrados en Compras o conciliados desde la caja diaria.
    const compra = {};
    data().compras.forEach((c) => { compra[c.id] = c; });
    (data().pagosFacturas || []).forEach((x, i) => {
      const c = compra[x.compraId];
      res.push({ id: 'PF-' + (x.id || i), pago: x.id, tipo: 'egreso', fecha: x.fecha, categoriaLabel: 'Pago de factura', subcategoria: c ? c.factura + ' · ' + c.proveedor : x.compraId, notas: x.notas || '',
        cuentaLabel: data().catalogos.cuentas[x.cuenta] || '', referencia: x.compraId, compra: x.compraId, monto: x.monto });
    });
    return res;
  }
  const movsBuscados = () => {
    const f = GS.filters('finanzas', DEF);
    const q = GS.norm((f.q || '').trim());
    // Todos los movimientos, de todos los años (el año elegido solo cambia el resumen), los más recientes primero.
    return (data().movimientos || []).concat(f.ventas ? movsVentas() : []).filter((m) => !q || GS.norm(m.categoriaLabel + ' ' + m.subcategoria + ' ' + m.notas + ' ' + m.referencia + ' ' + m.id + ' ' + m.fecha).includes(q))
      .sort((a, b) => (b.fecha + b.id).localeCompare(a.fecha + a.id));
  };
  GS.tablaRegistrar('movimientos', { filas: movsBuscados, columnas: colsMov, alCambiar: () => GS.views.finanzas.update() });

  // "Ver OC-…" / "Ver CP-…" despliega el detalle debajo de la fila, sin cambiar de página.
  const abiertosMov = new Set();
  // Un egreso que fue el pago de una factura (ej. migrado como "Compra por monto"): pasa a ser pago de esa factura.
  GS.actions.movimientoAPagoFactura = (id) => {
    const m = data().movimientos.find((x) => x.id === id);
    const opciones = data().compras.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))
      .map((c) => ({ value: c.id, label: c.id + ' · factura ' + c.factura + ' · ' + c.proveedor + ' · ' + fmt.date(c.fecha) + ' · ' + (c.porPagar <= 1 ? 'pagada' : 'por pagar ' + fmt.money(c.porPagar)) }));
    GS.formModal({
      title: 'Pasar ' + id + ' a pago de factura',
      submitLabel: 'Registrar como pago',
      fields: () => '<p class="hint">' + fmt.date(m.fecha) + ' · ' + esc(m.categoriaLabel) + ' · ' + esc(m.subcategoria || '') + ' · <strong>' + fmt.money(m.monto) + '</strong></p>' +
        '<div class="form-field"><label>Factura *</label><select name="compraId">' + GS.options([{ value: '', label: 'Elige la factura…' }].concat(opciones), '') + '</select></div>' +
        '<p class="hint">Se registra como pago de esa factura con la misma fecha, monto y cuenta (se ve en Compras → Pagos y aquí como "Pago de factura"). ' +
        'El movimiento ' + esc(id) + ' queda anulado para no contar el egreso dos veces. Si una factura se pagó en partes, repite esto con cada pago.</p>',
      onSubmit: (v) => GS.mutate('movimientoAPagoFactura', { id: id, compraId: v.compraId }, (r) => 'Pago ' + r.pago + ' registrado en ' + r.compraId),
    });
  };
  GS.actions.finVer = (id) => {
    if (abiertosMov.has(id)) abiertosMov.delete(id); else abiertosMov.add(id);
    GS.views.finanzas.update();
  };
  const detalleMov = (m) => {
    if (m.venta) { const v = data().ventas.find((x) => x.id === m.venta); return v && GS.detalleVenta ? GS.detalleVenta(v) : ''; }
    const c = data().compras.find((x) => x.id === m.compra);
    return c && GS.detalleCompra ? GS.detalleCompra(c) : '';
  };

  GS.views.finanzas = {
    title: 'Finanzas',
    render(el) {
      const f = GS.filters('finanzas', DEF);
      if (!f.anio) f.anio = data().hoy.slice(0, 4);
      const tab = (id, label) => '<button class="tab' + (f.tab === id ? ' active' : '') + '" data-action="tab" data-id="finanzas.' + id + '">' + label + '</button>';
      el.innerHTML =
        '<div class="page-head"><div><h1>Finanzas</h1><p>Resumen mensual del negocio y libro de movimientos: aportes, gastos, pagos al SII y compras por monto.</p></div>' +
        '<div class="btn-row"><div class="select-input"><select data-filter="finanzas.anio" aria-label="Año">' + GS.options(anios(), f.anio) + '</select></div>' +
        (GS.puede('operador') ? '<button class="btn" data-action="nuevoMovimiento">' + GS.icon('plus', 2.4) + 'Nuevo movimiento</button>' : '') + '</div></div>' +
        '<div class="tabs">' + tab('resumen', 'Resumen mensual') + tab('movimientos', 'Movimientos') + '</div>' +
        '<div id="fin-cuerpo"></div>';
      this.update();
    },
    update() {
      const f = GS.filters('finanzas', DEF);
      const anio = f.anio || data().hoy.slice(0, 4);
      const cuerpo = document.getElementById('fin-cuerpo');
      if (!cuerpo) return;
      if (f.tab === 'movimientos') {
        if (!document.getElementById('mov-tbody')) {
          cuerpo.innerHTML = '<div class="filters-bar"><div class="search-box">' + GS.icon('search') + '<input type="text" data-filter="finanzas.q" value="' + esc(f.q || '') + '" placeholder="Buscar categoría, detalle o referencia..."></div>' +
            '<label class="check"><input type="checkbox" data-filter="finanzas.ventas"' + (f.ventas ? ' checked' : '') + '> Incluir ventas y pagos de facturas</label><span class="count" id="mov-count"></span></div>' +
            '<div id="mov-resumen"></div>' +
            '<div class="table-wrap"><table class="data-table"><thead><tr id="mov-thead"></tr></thead><tbody id="mov-tbody"></tbody></table></div>';
        }
        const rows = GS.tablaAplicar('movimientos', movsBuscados(), colsMov);
        const op = GS.puede('operador');
        const admin = GS.puede('admin');
        const nv = rows.filter((m) => m.venta).length;
        // Resumen de lo visible (respeta el buscador y los filtros de columna); los anulados no cuentan.
        const vivos = rows.filter((m) => !m.anulado);
        const suma = (t) => vivos.filter((m) => m.tipo === t).reduce((a, m) => a + m.monto, 0);
        const ing = suma('ingreso');
        const egr = suma('egreso');
        const sinPago = data().compras.filter((c) => !(data().pagosFacturas || []).some((x) => x.compraId === c.id)).length;
        const pend = data().app.migracionCerrada ? {} : data().cajaPendiente || {};
        const nPend = Object.keys(pend).reduce((t, k) => t + pend[k], 0);
        document.getElementById('mov-resumen').innerHTML = (nPend
          ? '<div class="notice warn">Hay <strong>' + nPend + ' filas de la caja diaria sin migrar</strong> que todavía no aparecen aquí: ' +
            Object.keys(pend).sort((a, b) => pend[b] - pend[a]).map((k) => esc(k) + ' (' + pend[k] + ')').join(', ') +
            '. Revísalas y mígralas en <a href="#" data-nav="migracion">Migración → Caja diaria</a>.</div>'
          : '') + '<div class="kpi-grid">' +
          kpi('Ingresos', '<span class="text-success">+' + fmt.money(ing) + '</span>', vivos.filter((m) => m.tipo === 'ingreso').length + ' movimientos') +
          kpi('Egresos', '−' + fmt.money(egr), vivos.filter((m) => m.tipo === 'egreso').length + ' movimientos') +
          kpi('Saldo', '<span class="' + (ing - egr < 0 ? 'text-danger' : 'text-gold') + '">' + fmt.money(ing - egr) + '</span>', 'Ingresos − egresos de lo que se ve') + '</div>' +
          '<p class="table-note" style="margin:0 0 12px;">El saldo es lo que debería haber entre caja, banco y TUU <strong>si todo está registrado</strong>: aportes, ventas, gastos, pagos al SII y pagos de facturas. ' +
          (f.ventas && sinPago ? 'Ojo: ' + sinPago + (sinPago === 1 ? ' factura de compra no tiene' : ' facturas de compra no tienen') + ' pago registrado y no se restan. ' : '') +
          'Para el efectivo de la caja, filtra la columna Cuenta por "Caja (efectivo)" (los depósitos al banco no se registran como traspaso, así que el saldo por cuenta es solo referencial).</p>';
        document.getElementById('mov-count').textContent = rows.length + ' movimientos' + (nv ? ' · ' + nv + ' de ventas' : '');
        document.getElementById('mov-thead').innerHTML = GS.tablaEncabezado('movimientos', colsMov) + '<th></th>';
        document.getElementById('mov-tbody').innerHTML = rows.length ? rows.map((m) => '<tr class="' + (m.anulado ? 'row-muted' : '') + '">' +
          colsMov.map((c) => '<td class="' + (c.right ? 'cell-num right ' : '') + (c.clase || '') + '">' + c.celda(m) + '</td>').join('') +
          '<td><div class="row-actions">' + (m.venta || m.compra
            ? '<button class="btn small ghost" data-action="finVer" data-id="' + esc(m.id) + '" title="Ver el detalle aquí mismo">' + (abiertosMov.has(m.id) ? '▾ ' : '▸ ') + esc(m.venta || m.compra) + '</button>'
              + (admin && m.pago ? GS.iconBtn('reenlazarPagoCompra', m.pago, 'edit', 'Cambiar la factura de este pago') : '')
            : (op && !m.anulado ? GS.iconBtn('editarMovimiento', m.id, 'edit', 'Editar') : '') +
              (admin && !m.anulado && m.tipo === 'egreso' ? '<button class="btn small ghost" data-action="movimientoAPagoFactura" data-id="' + esc(m.id) + '" title="Este egreso fue el pago de una factura de compra: registrarlo en esa factura">→ Factura</button>' : '') +
              (admin && !m.anulado ? '<button class="btn small ghost" data-action="dividirMovimiento" data-id="' + esc(m.id) + '" title="Separar en partes con distinta categoría (ej. retiro de capital + compra de acciones)">Dividir</button>' : '') +
              (admin && !m.anulado ? GS.iconBtn('anularMovimiento', m.id, 'trash', 'Anular', 'danger') : '')) + '</div></td></tr>' +
          (abiertosMov.has(m.id) ? '<tr class="detalle-row"><td colspan="' + (colsMov.length + 1) + '">' + detalleMov(m) + '</td></tr>' : '')).join('')
          : '<tr><td colspan="' + (colsMov.length + 1) + '">' + GS.empty('Sin movimientos', 'Registra aportes, gastos, pagos al SII o compras por monto con "Nuevo movimiento".', 'finanzas') + '</td></tr>';
        return;
      }
      const r = resumen(anio);
      const total = (fila) => fila.valores.reduce((t, x) => t + x, 0);
      // Capital: aportes menos retiros de capital (devolución de aportes). La compra de acciones /
      // compensación a un socio es lo pagado por sobre sus aportes: no rebaja los aportes, se informa aparte.
      const sumaCat = (cats) => movsVivos().filter((m) => cats.indexOf(m.categoria) !== -1).reduce((t, m) => t + m.monto, 0);
      const aportes = sumaCat(['aporte']);
      const salidas = sumaCat(['retiro']);
      cuerpo.innerHTML = '<div class="kpi-grid">' +
        kpi('Ventas ' + anio, fmt.money(total(r.totalVentas)), 'productos y ventas por monto') +
        kpi('Egresos ' + anio, fmt.money(total(r.totalEgresos)), 'compras, gastos, SII y comisiones') +
        kpi('Flujo ' + anio, '<span class="' + (total(r.flujo) < 0 ? 'text-danger' : 'text-success') + '">' + fmt.money(total(r.flujo)) + '</span>', 'ventas + otros ingresos − egresos') +
        kpi('Aportes de capital', fmt.money(aportes - salidas), (salidas ? 'aportes ' + fmt.money(aportes) + ' − retiros ' + fmt.money(salidas) : 'acumulado de todos los años')) + '</div>' +
        tablaResumen(r) + tablaSocios();
    },
  };

  /* ---------- capital por socio ---------- */

  /** Aportes − retiros de capital por socio (el detalle del movimiento es el nombre del socio). */
  const claveSocio = (t) => GS.norm(String(t || '').replace(/^(aporte|retiro)( de capital)?\s*/i, '')).trim();
  function socios() {
    const res = {};
    movsVivos().filter((m) => m.categoria === 'aporte' || m.categoria === 'retiro').forEach((m) => {
      const k = claveSocio(m.subcategoria) || '(sin nombre)';
      const s = res[k] = res[k] || { nombre: String(m.subcategoria || '(sin nombre)').replace(/^(aporte|retiro)( de capital)?\s*/i, '') || '(sin nombre)', aportes: 0, retiros: 0 };
      if (m.categoria === 'aporte') s.aportes += m.monto; else s.retiros += m.monto;
    });
    return Object.keys(res).map((k) => Object.assign({ clave: k, saldo: res[k].aportes - res[k].retiros }, res[k])).sort((a, b) => b.saldo - a.saldo);
  }
  function tablaSocios() {
    const lista = socios();
    if (!lista.length) return '';
    return '<h3 class="sub-titulo" style="margin-top:22px;">Capital por socio</h3><div class="table-wrap"><table class="data-table" style="min-width:0"><thead><tr><th>Socio</th><th class="right">Aportes</th><th class="right">Retiros de capital</th><th class="right">Saldo</th></tr></thead><tbody>' +
      lista.map((s) => '<tr><td class="cell-strong">' + esc(s.nombre) + '</td><td class="cell-num right">' + fmt.money(s.aportes) + '</td><td class="cell-num right">' + (s.retiros ? '−' + fmt.money(s.retiros) : '—') + '</td>' +
        '<td class="cell-num right"><strong class="' + (s.saldo ? '' : 'muted') + '">' + fmt.money(s.saldo) + '</strong></td></tr>').join('') +
      '</tbody></table></div><p class="table-note">Aportes ("Patrimonio · aporte de capital") menos retiros ("Patrimonio · retiro de capital"), agrupados por el nombre del socio en el detalle. Un socio que salió debería quedar en $0.</p>';
  }

  /** Separa un movimiento en partes (ej. salida de un socio: retiro de capital hasta dejar sus aportes en 0 + compra de acciones). */
  GS.actions.dividirMovimiento = (id) => {
    const m = data().movimientos.find((x) => x.id === id);
    const cats = data().catalogos.categoriasMovimiento[m.tipo];
    const listaSocios = socios();
    const fila = (i, cat, sub, monto) => '<tr data-parte="' + i + '"><td><div class="form-field" style="margin:0"><select name="cat' + i + '">' + GS.options(Object.keys(cats).map((k) => ({ value: k, label: cats[k] })), cat) + '</select></div></td>' +
      '<td><div class="form-field" style="margin:0"><input name="sub' + i + '" value="' + esc(sub) + '" list="div-socios" placeholder="Detalle (en un retiro: el socio)"></div></td>' +
      '<td class="right"><input class="qty-input" style="width:120px" type="number" min="1" step="1" name="monto' + i + '" value="' + esc(monto) + '"></td></tr>';
    GS.formModal({
      title: 'Dividir ' + m.id,
      submitLabel: 'Dividir',
      size: 'wide',
      fields: () => '<p class="hint">' + esc(m.id) + ' · ' + fmt.date(m.fecha) + ' · ' + esc(m.categoriaLabel) + ' · ' + esc(m.subcategoria || '') + ' · <strong>' + fmt.money(m.monto) + '</strong></p>' +
        '<datalist id="div-socios">' + listaSocios.map((s) => '<option value="' + esc(s.nombre) + '">').join('') + '</datalist>' +
        '<div class="table-wrap"><table class="data-table" style="min-width:0"><thead><tr><th>Categoría</th><th>Detalle</th><th class="right">Monto</th></tr></thead><tbody data-partes>' +
        fila(0, m.categoria, m.subcategoria, m.monto) + fila(1, m.tipo === 'egreso' ? 'retiro' : 'otro_ingreso', '', '') + '</tbody></table></div>' +
        '<div class="btn-row" style="margin-top:8px;"><button type="button" class="btn small ghost" data-div-agregar>+ Agregar parte</button></div>' +
        '<div data-div-info></div>' +
        '<p class="hint">La primera parte queda en ' + esc(m.id) + '; las demás se crean como movimientos nuevos con la misma fecha, cuenta y referencia. Las partes deben sumar ' + fmt.money(m.monto) + '.</p>',
      onMount: (form) => {
        let n = 2;
        const partes = () => Array.from(form.querySelectorAll('[data-parte]')).map((tr) => {
          const i = tr.dataset.parte;
          return { categoria: form.elements['cat' + i].value, subcategoria: form.elements['sub' + i].value, monto: Number(form.elements['monto' + i].value) || 0 };
        });
        const upd = () => {
          const ps = partes();
          const suma = ps.reduce((t, x) => t + x.monto, 0);
          // En un retiro de capital: cuánto falta para dejar al socio en 0 (sin contar este movimiento).
          const ayudas = ps.map((x, i) => {
            if (x.categoria !== 'retiro' || !x.subcategoria) return '';
            const s = listaSocios.find((y) => y.clave === claveSocio(x.subcategoria));
            if (!s) return '';
            const propio = m.categoria === 'retiro' && claveSocio(m.subcategoria) === s.clave ? m.monto : 0;
            const falta = s.saldo + propio;
            return '<p class="table-note">' + esc(s.nombre) + ': aportes ' + fmt.money(s.aportes) + ', retiros ' + fmt.money(s.retiros - propio) + ' → para dejarlo en $0 el retiro debe ser <strong>' + fmt.money(falta) + '</strong> ' +
              '<button type="button" class="btn small ghost" data-div-usar="' + form.querySelectorAll('[data-parte]')[i].dataset.parte + '" data-monto="' + falta + '">Usar</button></p>';
          }).join('');
          form.querySelector('[data-div-info]').innerHTML = ayudas +
            '<p class="table-note ' + (suma === m.monto ? 'text-success' : 'text-gold') + '">Suma de las partes: ' + fmt.money(suma) + (suma === m.monto ? ' ✓' : ' (faltan ' + fmt.money(m.monto - suma) + ')') + '</p>';
        };
        form.addEventListener('input', upd);
        form.addEventListener('change', upd);
        form.addEventListener('click', (e) => {
          if (e.target.dataset.divAgregar != null) {
            form.querySelector('[data-partes]').insertAdjacentHTML('beforeend', fila(n++, Object.keys(cats)[0], '', ''));
            upd();
          }
          if (e.target.dataset.divUsar != null) {
            const i = e.target.dataset.divUsar;
            form.elements['monto' + i].value = e.target.dataset.monto;
            // La primera parte se ajusta para que la suma calce.
            if (i !== '0') {
              const otras = partes().reduce((t, x, k) => t + (k === 0 ? 0 : x.monto), 0);
              form.elements.monto0.value = Math.max(0, m.monto - otras);
            }
            upd();
          }
        });
        upd();
      },
      onSubmit: (v, form) => {
        const ps = Array.from(form.querySelectorAll('[data-parte]')).map((tr) => {
          const i = tr.dataset.parte;
          return { categoria: v['cat' + i], subcategoria: v['sub' + i], monto: v['monto' + i] };
        }).filter((x) => Number(x.monto) > 0);
        return GS.mutate('dividirMovimiento', { id: id, partes: ps }, (r) => m.id + ' dividido en ' + (r.nuevos.length + 1) + ' movimientos');
      },
    });
  };

  /* ---------- formulario ---------- */

  /** pre (opcional, desde Compras → Nueva compra): { titulo, categoria, subcategoria, ayuda }. */
  function formMovimiento(m, pre) {
    const c = data().catalogos;
    const x = m || { fecha: data().hoy, tipo: 'egreso', categoria: (pre && pre.categoria) || 'gav', subcategoria: (pre && pre.subcategoria) || '', monto: '', cuenta: '', referencia: '', notas: '', iva: 0 };
    const opcionesCat = (tipo, sel) => GS.options(Object.keys(c.categoriasMovimiento[tipo]).map((k) => ({ value: k, label: c.categoriasMovimiento[tipo][k] })), sel);
    const tasa = data().app.iva;
    GS.formModal({
      title: m ? 'Editar movimiento ' + m.id : (pre && pre.titulo) || 'Nuevo movimiento',
      submitLabel: 'Guardar movimiento',
      fields: () => '<div class="form-grid">' +
        '<div class="form-field"><label>Fecha *</label><input type="date" name="fecha" value="' + esc(x.fecha) + '"></div>' +
        '<div class="form-field"><label>Tipo *</label><select name="tipo">' + GS.options([{ value: 'egreso', label: 'Egreso' }, { value: 'ingreso', label: 'Ingreso' }], x.tipo) + '</select></div>' +
        '<div class="form-field"><label>Categoría *</label><select name="categoria">' + opcionesCat(x.tipo, x.categoria) + '</select></div>' +
        '<div class="form-field"><label>Monto *</label><input type="number" name="monto" min="1" step="1" value="' + esc(x.monto) + '" placeholder="Ej: 25000"></div>' +
        '<div class="form-field"><label>Detalle</label><input name="subcategoria" value="' + esc(x.subcategoria) + '" placeholder="Ej: Sueldo Alex, Singles lote 12, socio Jaime"></div>' +
        '<div class="form-field"><label>Cuenta</label><select name="cuenta">' + GS.options([{ value: '', label: 'Sin cuenta' }].concat(Object.keys(c.cuentas).map((k) => ({ value: k, label: c.cuentas[k] }))), x.cuenta) + '</select></div>' +
        '<div class="form-field"><label>Referencia</label><input name="referencia" value="' + esc(x.referencia) + '" placeholder="N° de documento, boleta…"></div>' +
        '<div class="form-field" data-mv-fac><label class="check" style="margin-top:22px;"><input type="checkbox" name="conFactura"' + (x.iva ? ' checked' : '') + '> Con factura (registrar el IVA como crédito fiscal)</label></div>' +
        '<div class="form-field" data-mv-iva' + (x.iva ? '' : ' hidden') + '><label>IVA incluido en el monto</label><input type="number" name="iva" min="0" step="1" value="' + esc(x.iva || '') + '"></div>' +
        '<div class="form-field full"><label>Notas</label><textarea name="notas" rows="2">' + esc(x.notas) + '</textarea></div></div>' +
        '<p class="hint">' + ((pre && pre.ayuda) || 'Las ventas y las facturas de compra se registran en sus módulos; aquí va todo lo demás. Compra de singles: categoría "Compra por monto" con detalle "Singles …".') +
        ' Si el gasto viene con factura, marca "Con factura": el IVA se calcula solo (' + Math.round(tasa * 100) + '% incluido en el monto) y se descuenta del IVA estimado.</p>',
      onMount: (form) => {
        let ivaTocado = !!x.iva;
        const upd = () => {
          const egreso = form.elements.tipo.value === 'egreso';
          form.querySelector('[data-mv-fac]').hidden = !egreso;
          const con = egreso && form.elements.conFactura.checked;
          form.querySelector('[data-mv-iva]').hidden = !con;
          if (con && !ivaTocado) form.elements.iva.value = Math.round((Number(form.elements.monto.value) || 0) * tasa / (1 + tasa)) || '';
        };
        form.elements.tipo.addEventListener('change', () => { form.elements.categoria.innerHTML = opcionesCat(form.elements.tipo.value, ''); upd(); });
        form.elements.conFactura.addEventListener('change', upd);
        form.elements.monto.addEventListener('input', upd);
        form.elements.iva.addEventListener('input', () => { ivaTocado = true; });
        upd();
      },
      onSubmit: (v) => {
        const datos = Object.assign({ id: m ? m.id : '' }, v, { iva: v.tipo === 'egreso' && v.conFactura ? v.iva : 0 });
        delete datos.conFactura;
        return GS.mutate('guardarMovimiento', datos, m ? 'Movimiento actualizado' : (r) => 'Movimiento ' + r.id + ' registrado');
      },
    });
  }
  GS.formMovimiento = formMovimiento;
  GS.actions.nuevoMovimiento = () => formMovimiento(null);
  GS.actions.editarMovimiento = (id) => formMovimiento(data().movimientos.find((m) => m.id === id));
  GS.actions.anularMovimiento = (id) => {
    const m = data().movimientos.find((x) => x.id === id);
    GS.confirm({
      title: 'Anular ' + m.id,
      message: '<strong>' + esc(m.categoriaLabel) + '</strong> por ' + fmt.money(m.monto) + ' deja de contar en el resumen. Queda en la lista como anulado y en la auditoría.',
      confirmLabel: 'Sí, anular',
      danger: true,
      onConfirm: () => GS.mutate('anularMovimiento', { id: id }, 'Movimiento anulado'),
    });
  };
})();
</script>
